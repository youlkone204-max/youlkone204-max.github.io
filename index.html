<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IA Creator</title><meta name="theme-color" content="#0B4D1F"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F4F7F3;--fg:#10261A;--mu:#566459;--cd:#FFFFFF;--bd:#DCE5DB;--ac:#0B5A2A;--acf:#FFFFFF;--go:#C9A227;--ok:#1B8A55;--bad:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1710;--fg:#EAF2EA;--mu:#9DB0A0;--cd:#15241B;--bd:#25382B;--ac:#3FBF74;--acf:#06140B;--go:#E3C04F;--ok:#5FD39A;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#0C1710;--fg:#EAF2EA;--mu:#9DB0A0;--cd:#15241B;--bd:#25382B;--ac:#3FBF74;--acf:#06140B;--go:#E3C04F;--ok:#5FD39A;--bad:#FF8A80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 130px}
.hero{background:linear-gradient(135deg,#0B4D1F,#0E7A3B);color:#fff;text-align:center;padding:26px 18px 28px;border-radius:0 0 34px 34px;margin:0 -18px 22px;border-bottom:4px solid #D4AF37}
.hero img{width:96px;height:96px;border-radius:50%;border:3px solid #D4AF37;background:#fff;object-fit:cover}
.hero h1{margin:8px 0 0;font-size:2.1rem}.hero p{margin:4px 0 0;font-size:1.05rem;color:#F1DC8A}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--cd);color:var(--fg);border:0;border-radius:22px;padding:18px 8px;font:inherit;font-weight:700;font-size:1.05rem;box-shadow:0 6px 18px rgba(11,60,30,.12);cursor:pointer;min-height:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile i{font-style:normal;font-size:2.8rem;line-height:1}
h2{font-size:1.5rem;color:var(--ac);margin:4px 0 14px}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.box b{display:block}.mu{color:var(--mu);font-size:.92rem}
.btn{display:block;width:100%;background:var(--ac);color:var(--acf);border:0;border-radius:16px;padding:13px;font:inherit;font-weight:700;cursor:pointer;min-height:48px;margin-top:10px;text-align:center;text-decoration:none}
.btn.alt{background:var(--cd);color:var(--ac);border:2px solid var(--ac)}.btn.wa{background:#1FA855;color:#fff}
label{display:block;font-weight:700;margin-top:10px}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:4px}
.opt{display:block;width:100%;text-align:left;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;font:inherit;cursor:pointer;min-height:44px}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.stat{display:flex;gap:10px}.stat .box{flex:1;text-align:center;margin:0}.stat strong{font-size:1.7rem;color:var(--ac)}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--go)}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:700;background:var(--go);color:#1a1400}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row .btn{width:auto;padding:8px 14px;min-height:44px;margin:0}
.cert{border:6px double var(--go);background:var(--cd);text-align:center;padding:24px 14px;border-radius:12px}
.cert img{width:80px;height:80px;border-radius:50%}.cert h3{font-size:1.5rem;margin:8px 0;color:var(--ac)}.cert .nm{font-size:1.6rem;font-weight:800;margin:12px 0}
footer{text-align:center;color:var(--mu);margin:24px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;min-height:48px;min-width:64px;display:flex;flex-direction:column;align-items:center}
nav i{font-style:normal;font-size:1.5rem;line-height:1.1}pre{white-space:pre-wrap;font:inherit;margin:0}
.lq{display:block;width:100%;text-align:left;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;font:inherit;cursor:pointer;min-height:44px}.lq.ok{border-color:var(--ok)}.lq.bad{border-color:var(--bad)}.pbox{background:var(--cd);border:1px dashed var(--go);border-radius:12px;padding:12px;margin:12px 0}ul{padding-left:20px}li{margin-bottom:6px}
@media print{nav,.np{display:none!important}.wrap{padding:0}}
</style>
</head>

var LS={"0":[{"t": "Comprendre Facebook pour créer du contenu", "d": "Profil, page, groupe : que choisir ?", "b": ["Facebook propose trois espaces principaux. Le <b>profil</b> est personnel : il sert à vos amis et à votre famille. La <b>page</b> est faite pour une marque, un créateur ou une entreprise. Le <b>groupe</b> réunit une communauté autour d’un sujet."], "l": ["<b>Profil</b> : personnel, pour vos proches.", "<b>Page</b> : professionnelle, pour votre activité.", "<b>Groupe</b> : communauté, pour échanger et fidéliser."], "b2": ["Pour développer une activité, la <b>page</b> est le point de départ : elle donne accès aux statistiques et aux publicités, elle donne une image professionnelle et elle sépare votre vie privée de votre travail.", "En général, Facebook met en avant les contenus qui retiennent l’attention : une vidéo regardée jusqu’au bout, un message qui fait réagir ou commenter, un contenu que les gens partagent. Retenez une idée simple : <b>créez du contenu utile, clair et régulier</b>."], "q": {"q": "Quel espace choisir pour promouvoir votre activité ?", "o": ["Un profil personnel", "Une page", "Un groupe privé uniquement"], "a": 1, "e": "La page donne les statistiques et une image professionnelle."}}, {"t": "Créer une page professionnelle", "d": "Nom, logo, description et bouton WhatsApp", "b": ["Une bonne page se reconnaît en quelques secondes. Voici les éléments à soigner :"], "l": ["<b>Nom</b> : court, facile à retenir, sans fautes.", "<b>Photo de profil</b> : votre logo ou votre visage, bien visible même en petit.", "<b>Photo de couverture</b> : une image qui montre ce que vous faites, avec votre slogan.", "<b>Description</b> : qui vous aidez, comment, et comment vous contacter.", "<b>Bouton d’action</b> : ajoutez WhatsApp ou Appeler pour que les clients vous écrivent facilement."], "b2": ["Protégez aussi votre compte : activez la <b>vérification en deux étapes</b> et ne partagez jamais votre mot de passe."], "p": "Tu es un expert en marketing sur Facebook. Rédige 3 descriptions de page Facebook de 2 phrases maximum pour [votre activité], à destination de [votre public]. Ton : [chaleureux / professionnel]. Termine chaque description par un appel à l’action pour me contacter sur WhatsApp.", "q": {"q": "Quel bouton aide les clients à vous contacter facilement ?", "o": ["Un bouton WhatsApp ou Appeler", "Un bouton Partager uniquement", "Aucun bouton"], "a": 0, "e": "Un bouton de contact direct facilite la prise de contact."}}, {"t": "Choisir votre sujet et votre public", "d": "Trouver votre niche et votre promesse", "b": ["Un sujet trop large ne retient personne. Un sujet précis attire les bonnes personnes. Posez-vous trois questions : <b>qui</b> voulez-vous aider, <b>quel problème</b> résolvez-vous, <b>quelle promesse</b> faites-vous ?", "Exemple : « J’aide les petits commerçants à vendre plus grâce à Facebook, en 10 minutes par jour. » Le public, le problème et la promesse sont clairs.", "Regardez aussi ce que font les autres créateurs de votre domaine : quels contenus reçoivent des commentaires ? Inspirez-vous des idées, <b>sans jamais copier</b> les textes ou les images des autres."], "p": "Aide-moi à définir ma niche sur Facebook. Mon domaine : [domaine]. Mes compétences : [compétences]. Propose 5 publics possibles, le problème principal de chacun et une phrase de promesse. Pose-moi 3 questions si tu manques d’informations.", "q": {"q": "Qu’est-ce qui rend un sujet efficace ?", "o": ["Il est très large", "Il est précis, avec un public et une promesse clairs", "Il copie la concurrence"], "a": 1, "e": "La précision attire les bonnes personnes."}}, {"t": "Écrire des publications avec l’IA", "d": "Accroche, valeur et appel à l’action", "b": ["Une bonne publication suit une structure simple :"], "l": ["<b>Accroche</b> : la première ligne doit donner envie de lire.", "<b>Valeur</b> : une astuce, une histoire ou une information utile.", "<b>Appel à l’action</b> : posez une question, invitez à commenter ou à écrire en message."], "b2": ["L’IA vous fait gagner du temps pour les idées et le premier jet. Mais <b>relisez toujours</b> : corrigez les erreurs, ajoutez vos exemples réels et gardez votre façon de parler. Vérifiez les chiffres et les informations avant de publier."], "p": "Tu es community manager. Écris une publication Facebook de 80 à 120 mots sur [sujet] pour [public]. Structure : une accroche forte, 3 conseils concrets, une question pour inciter aux commentaires. Ton : simple et amical. Langue : français. Ajoute 3 hashtags utiles.", "q": {"q": "Que faire après avoir généré un texte avec l’IA ?", "o": ["Le publier tel quel", "Le relire, le corriger et l’adapter", "L’envoyer sans le lire"], "a": 1, "e": "L’IA propose, vous validez."}}, {"t": "Créer des visuels et des vidéos avec l’IA", "d": "Images, affiches et vidéos courtes", "b": ["Les publications avec une image ou une vidéo attirent généralement plus l’attention. Avec l’IA, vous pouvez créer des images, des affiches et des idées de vidéos courtes, même sans être graphiste.", "Pour une bonne image, décrivez : le <b>sujet</b>, le <b>style</b> (réaliste, minimaliste…), les <b>couleurs</b>, l’<b>ambiance</b> et le <b>format</b> (carré ou vertical).", "Attention : les outils d’image écrivent parfois mal le texte. Générez l’image sans texte, puis ajoutez vos mots avec une application de design. N’utilisez jamais le visage d’une personne réelle sans son accord, ni des logos ou personnages protégés par des droits."], "p": "Crée une image pour une publication Facebook : [sujet]. Style : moderne et lumineux. Couleurs : [vos couleurs]. Format vertical 4:5. Sans aucun texte dans l’image. Laisse de l’espace en haut pour ajouter un titre.", "q": {"q": "Comment obtenir un texte lisible sur une image ?", "o": ["Demander à l’IA de l’écrire à chaque fois", "Générer l’image sans texte, puis ajouter le texte soi-même", "Utiliser une image floue"], "a": 1, "e": "Vous contrôlez ainsi l’orthographe et la lisibilité."}}, {"t": "Régularité, calendrier et statistiques", "d": "Planifier 30 jours et mesurer vos résultats", "b": ["La régularité compte plus que la perfection. Une bonne base pour débuter : <b>3 à 5 publications par semaine</b>, à des moments où votre public est en ligne.", "Construisez un calendrier simple : un jour pour un conseil, un jour pour une histoire ou un témoignage, un jour pour une offre, un jour pour une question.", "Consultez ensuite les <b>statistiques</b> de votre page : portée (combien de personnes ont vu), interactions (réactions, commentaires, partages) et abonnés. Gardez ce qui marche, améliorez le reste.", "Respectez les règles de Facebook : pas de fausses promesses, pas d’achat de faux abonnés, pas de contenus copiés. Votre page sera plus durable.", "<b>Mini-projet</b> : préparez et publiez vos 7 premières publications cette semaine."], "p": "Crée un calendrier de contenu Facebook de 30 jours pour [activité], à destination de [public]. Pour chaque jour : le type de publication (texte, image, vidéo courte), le sujet et une idée d’accroche. Alterne conseils, histoires, offres et questions.", "q": {"q": "Que faire avec les statistiques de votre page ?", "o": ["Les ignorer", "Garder les contenus qui marchent et améliorer le reste", "Supprimer la page"], "a": 1, "e": "Les statistiques montrent ce qui plaît à votre public."}}]};
LS["1"]=[{"t": "Comprendre TikTok et son public", "d": "Comment fonctionne le fil « Pour toi »", "b": ["TikTok est une application de <b>vidéos courtes en format vertical</b> (9:16). Sa particularité : le fil <b>« Pour toi »</b> montre des vidéos choisies pour chaque personne, même si elle ne suit pas encore le compte qui les a publiées.", "Cela veut dire qu’un petit compte peut être vu par beaucoup de monde avec une seule bonne vidéo. Ce qui compte, ce n’est pas d’avoir déjà beaucoup d’abonnés, c’est de <b>captiver les gens dès les premières secondes</b>."], "l": ["Les gens regardent-ils la vidéo jusqu’au bout ?", "Réagissent-ils (j’aime, commentaires, partages, enregistrements) ?", "Le sujet correspond-il à ce qu’ils aiment regarder ?"], "b2": ["Retenez la règle de base : <b>une idée par vidéo, claire, courte et utile ou amusante</b>. Les détails changent avec le temps, mais cette logique reste vraie."], "q": {"q": "Qu’est-ce qui aide le plus une vidéo à être montrée à d’autres personnes ?", "o": ["Avoir déjà des milliers d’abonnés", "Que les gens la regardent longtemps et réagissent", "Publier à minuit uniquement"], "a": 1, "e": "Le temps de visionnage et les réactions comptent beaucoup."}}, {"t": "Créer et optimiser votre compte", "d": "Pseudo, photo, bio et contact", "b": ["Votre profil est votre vitrine : en quelques secondes, un visiteur doit comprendre <b>qui vous êtes et ce que vous apportez</b>."], "l": ["<b>Pseudo</b> : court, facile à retenir et à écrire.", "<b>Photo</b> : votre visage ou votre logo, bien lisible en petit.", "<b>Bio</b> : courte (environ 80 caractères), avec votre promesse et un appel à l’action.", "<b>Contact</b> : ajoutez un moyen de vous joindre (lien ou WhatsApp) selon les options disponibles pour votre compte."], "b2": ["Si vous vendez ou promouvez une activité, pensez à un <b>compte professionnel</b> : il donne accès à des statistiques, mais il limite en général les musiques à celles autorisées pour un usage commercial.", "Protégez votre compte : activez la <b>vérification en deux étapes</b> et ne partagez jamais votre mot de passe."], "p": "Tu es un expert TikTok. Écris 5 idées de bio TikTok de 80 caractères maximum pour [votre activité], à destination de [votre public]. Chaque bio doit contenir une promesse claire et un appel à l’action. Ton : [simple et motivant]. Ajoute 1 emoji maximum par bio.", "q": {"q": "Que doit montrer votre bio en priorité ?", "o": ["Votre date de naissance", "Qui vous aidez et ce que vous apportez", "Une longue histoire de votre vie"], "a": 1, "e": "Une bio claire donne envie de s’abonner."}}, {"t": "Trouver vos idées de vidéos", "d": "Piliers de contenu et tendances", "b": ["Pour ne jamais manquer d’idées, choisissez 3 ou 4 <b>piliers de contenu</b>, c’est-à-dire des types de vidéos que vous répétez :"], "l": ["<b>Éduquer</b> : une astuce, une explication, une erreur à éviter.", "<b>Raconter</b> : votre histoire, les coulisses, un client ou un élève.", "<b>Prouver</b> : un avant/après, un résultat, une démonstration.", "<b>Divertir</b> : un format léger lié à votre sujet."], "b2": ["Surveillez les <b>tendances</b> (sons, formats, défis) mais adaptez-les à votre sujet au lieu de les copier. Lisez aussi les commentaires : les questions des gens sont une mine d’idées.", "Ne copiez jamais la vidéo d’un autre créateur. Inspirez-vous du format, puis apportez votre propre contenu."], "p": "Tu es un stratège de contenu TikTok. Mon domaine : [domaine]. Mon public : [public]. Propose 30 idées de vidéos réparties en 4 piliers (éduquer, raconter, prouver, divertir). Pour chaque idée, donne un titre et une accroche de moins de 10 mots.", "q": {"q": "Comment utiliser une tendance intelligemment ?", "o": ["Copier exactement la vidéo d’un autre", "L’adapter à votre sujet avec votre propre contenu", "L’ignorer toujours"], "a": 1, "e": "Adapter une tendance, c’est rester original."}}, {"t": "Écrire un script qui retient l’attention", "d": "Accroche, contenu et appel à l’action en 30 secondes", "b": ["Une vidéo qui marche suit presque toujours la même structure :"], "l": ["<b>Accroche (0 à 3 secondes)</b> : une phrase choc, une question ou une promesse.", "<b>Contenu (3 à 25 secondes)</b> : 2 ou 3 points clairs, rythme rapide.", "<b>Appel à l’action (fin)</b> : invitez à commenter, enregistrer ou suivre le compte."], "b2": ["Écrivez comme vous <b>parlez</b> : phrases courtes, mots simples. Ajoutez du <b>texte à l’écran</b> et des <b>sous-titres</b>, car beaucoup de gens regardent sans le son.", "L’IA peut écrire le premier script en quelques secondes. Relisez-le à voix haute : s’il est difficile à dire, simplifiez-le."], "p": "Tu es un scénariste de vidéos TikTok. Écris un script de 30 secondes sur [sujet] pour [public]. Structure : une accroche de 3 secondes, 3 points courts, un appel à l’action. Langue : français parlé et simple. Indique aussi le texte à afficher à l’écran pour chaque partie.", "q": {"q": "À quel moment faut-il captiver le spectateur ?", "o": ["À la fin de la vidéo", "Dans les premières secondes", "Après 20 secondes"], "a": 1, "e": "Sans bonne accroche, les gens passent à la vidéo suivante."}}, {"t": "Filmer, monter et utiliser l’IA", "d": "Lumière, son, sous-titres et outils IA", "b": ["Vous n’avez pas besoin de matériel coûteux : votre téléphone suffit si vous soignez <b>la lumière, le son et le cadrage</b>."], "l": ["<b>Lumière</b> : placez-vous face à une fenêtre ou en plein jour.", "<b>Son</b> : choisissez un endroit calme, parlez près du téléphone.", "<b>Cadrage</b> : filmez en vertical, votre visage et vos mains bien visibles.", "<b>Montage</b> : coupez les silences, gardez des plans courts, ajoutez des sous-titres (applications comme CapCut)."], "b2": ["L’IA peut vous aider à créer des images, des voix off et des courtes séquences vidéo. Mais respectez les règles : <b>n’utilisez jamais le visage ou la voix d’une vraie personne sans son accord</b>, et ne diffusez pas de faux contenus qui peuvent tromper.", "TikTok demande d’indiquer quand un contenu réaliste est créé ou modifié par l’IA : utilisez l’option d’étiquetage prévue lors de la publication, et vérifiez les règles actuelles dans l’application. Pour la musique, choisissez des sons autorisés pour votre type de compte."], "p": "Crée une courte séquence vidéo verticale (format 9:16) de 5 secondes : [décrivez la scène]. Style : réaliste et lumineux. Mouvement de caméra : lent travelling avant. Sans texte dans l’image et sans visage d’une personne réelle.", "q": {"q": "Que faire pour un contenu réaliste créé avec l’IA ?", "o": ["Le cacher", "Utiliser l’étiquette prévue par TikTok pour l’indiquer", "Utiliser le visage d’une célébrité"], "a": 1, "e": "La transparence protège votre compte et votre public."}}, {"t": "Publier, analyser et progresser", "d": "Régularité, statistiques et plan sur 30 jours", "b": ["La régularité compte plus que la perfection. Pour débuter, visez <b>3 à 5 vidéos par semaine</b>, ou une par jour si vous le pouvez. Publiez quand votre public est actif et testez plusieurs horaires.", "Dans la légende, utilisez <b>des mots-clés liés à votre sujet</b> et quelques hashtags utiles. Répondez aux commentaires : cela encourage la discussion.", "Consultez vos <b>statistiques</b> : vues, durée moyenne de visionnage, partages, nouveaux abonnés. Regardez surtout <b>à quel moment les gens quittent la vidéo</b> et améliorez cette partie.", "Respectez les règles de la communauté : pas d’achat de faux abonnés ou de fausses vues, pas de promesses trompeuses. Votre compte sera plus durable.", "<b>Mini-projet</b> : publiez 10 vidéos en 14 jours, puis analysez les 2 meilleures et les 2 moins bonnes."], "p": "Voici les statistiques de mes 10 dernières vidéos TikTok : [collez ici les vues, la durée moyenne de visionnage et les partages]. Analyse-les, dis-moi ce qui marche et ce qui ne marche pas, puis propose un plan de 30 jours avec 3 améliorations prioritaires.", "q": {"q": "Que faire avec les statistiques de vos vidéos ?", "o": ["Les ignorer", "Repérer ce qui marche et améliorer le reste", "Supprimer le compte"], "a": 1, "e": "Les statistiques indiquent ce qui plaît à votre public."}}];
LS["2"]=[{"t": "Comprendre YouTube", "d": "Vidéos longues, Shorts et recommandations", "b": ["YouTube est à la fois un <b>moteur de recherche</b> (les gens tapent une question) et une <b>plateforme de recommandations</b> (la page d’accueil et les vidéos suggérées). Une bonne vidéo peut donc être trouvée longtemps après sa publication."], "l": ["<b>Vidéos longues</b> : idéales pour expliquer, enseigner et gagner la confiance.", "<b>Shorts</b> : vidéos verticales très courtes, utiles pour se faire connaître.", "<b>Chaîne</b> : votre bibliothèque de vidéos, qui travaille pour vous dans la durée."], "b2": ["Deux choses décident du succès d’une vidéo : les gens <b>cliquent-ils</b> (titre et miniature) et <b>restent-ils</b> (qualité du début et du contenu). Toute la formation tourne autour de ces deux idées."], "q": {"q": "Quels sont les deux éléments clés pour réussir une vidéo ?", "o": ["Le nombre de hashtags et la durée", "Le clic (titre et miniature) et la rétention", "La couleur du logo"], "a": 1, "e": "On doit donner envie de cliquer, puis de rester."}}, {"t": "Créer et optimiser votre chaîne", "d": "Nom, logo, bannière et description", "b": ["Votre chaîne doit être comprise en quelques secondes. Soignez ces éléments :"], "l": ["<b>Nom</b> : simple, facile à retenir et à écrire.", "<b>Logo</b> : lisible en très petit, avec peu de détails.", "<b>Bannière</b> : dites ce que vous proposez et à quel rythme vous publiez.", "<b>Description</b> : qui vous aidez, quels sujets, et comment vous contacter.", "<b>Contact</b> : ajoutez votre adresse e-mail professionnelle ou vos liens."], "b2": ["Protégez votre compte avec la <b>vérification en deux étapes</b>, car perdre une chaîne est très difficile à rattraper."], "p": "Tu es un expert YouTube. Écris 3 descriptions de chaîne YouTube de 100 à 150 mots pour [votre domaine], à destination de [votre public]. Chaque description doit contenir : la promesse de la chaîne, les sujets traités, la fréquence de publication et un appel à s’abonner. Ton : [simple et chaleureux].", "q": {"q": "Que doit permettre votre description de chaîne ?", "o": ["Comprendre qui vous aidez et ce que vous proposez", "Raconter toute votre vie", "Rester vide"], "a": 0, "e": "Une description claire aide à convaincre les visiteurs de s’abonner."}}, {"t": "Choisir votre sujet et vos idées de vidéos", "d": "Niche, mots-clés et formats qui marchent", "b": ["Choisissez un sujet précis et un public précis. Pour trouver des idées, utilisez la <b>barre de recherche de YouTube</b> : les suggestions qui apparaissent quand vous tapez un début de phrase sont les recherches réelles des gens.", "Voici trois formats simples qui fonctionnent bien :"], "l": ["<b>Répondre à une question</b> : « Comment faire… ? »", "<b>Tutoriel pas à pas</b> : montrer une méthode du début à la fin.", "<b>Liste</b> : « 5 erreurs à éviter… », « 7 outils pour… »"], "b2": ["Regardez ce que font les autres chaînes de votre domaine : quelles vidéos reçoivent beaucoup de vues et de commentaires ? Inspirez-vous des idées, <b>sans copier</b> leurs contenus."], "p": "Tu es un stratège YouTube. Mon domaine : [domaine]. Mon public : [public]. Propose 30 idées de vidéos réparties en 3 formats (réponse à une question, tutoriel, liste). Pour chaque idée, donne un titre accrocheur et le problème résolu pour le spectateur.", "q": {"q": "Où trouver de vraies idées de recherche des gens ?", "o": ["Dans les suggestions de la barre de recherche YouTube", "Dans un dictionnaire", "Au hasard"], "a": 0, "e": "Les suggestions reflètent ce que les gens cherchent vraiment."}}, {"t": "Titres, miniatures et descriptions", "d": "Donner envie de cliquer, sans tromper", "b": ["Le <b>titre</b> doit être clair, contenir un mot-clé important et annoncer un bénéfice. Gardez-le assez court pour rester lisible sur téléphone.", "La <b>miniature</b> est l’image qui donne envie de cliquer. Quelques règles simples :"], "l": ["Un visage expressif ou un élément très visible.", "3 à 4 mots maximum, en grosses lettres.", "Des couleurs contrastées, lisibles même en petit.", "Une image qui correspond vraiment au contenu de la vidéo."], "b2": ["Dans la <b>description</b>, les 2 premières lignes sont les plus importantes : résumez la vidéo avec vos mots-clés. Ajoutez ensuite des chapitres et vos liens.", "Ne faites jamais de titre ou de miniature <b>trompeurs</b> : les spectateurs quittent la vidéo, ce qui nuit à votre chaîne."], "p": "Tu es un expert en titres YouTube. Pour une vidéo sur [sujet], destinée à [public], propose 10 titres clairs de moins de 60 caractères, dont le mot-clé principal est [mot-clé]. Ajoute ensuite une description de 100 mots avec un résumé, 5 mots-clés naturels et un appel à s’abonner.", "q": {"q": "Que faut-il éviter pour une miniature ?", "o": ["Un texte court et lisible", "Une image qui ne correspond pas à la vidéo", "Des couleurs contrastées"], "a": 1, "e": "Une miniature trompeuse fait fuir les spectateurs."}}, {"t": "Script, tournage et montage avec l’IA", "d": "Structurer sa vidéo et gagner du temps", "b": ["Un bon script suit une structure simple :"], "l": ["<b>Accroche</b> : les 10 premières secondes donnent la promesse de la vidéo.", "<b>Contenu</b> : 3 à 5 points clairs, avec des exemples.", "<b>Conclusion et appel à l’action</b> : résumez et invitez à s’abonner ou à voir une autre vidéo."], "b2": ["Pour le tournage, le <b>son</b> est plus important que l’image : parlez dans un endroit calme, près du micro. Filmez face à la lumière du jour. Au montage, coupez les silences, ajoutez des sous-titres et des images pour illustrer vos propos.", "L’IA peut écrire le premier script, proposer des plans et aider à la voix off. Respectez les règles : indiquez quand un contenu réaliste est modifié ou généré par l’IA, en suivant les options de YouTube lors de la publication. Utilisez des musiques dont vous avez le droit, par exemple celles de la bibliothèque audio de YouTube, et ne copiez jamais les contenus des autres."], "p": "Tu es scénariste YouTube. Écris le script d’une vidéo de 5 minutes sur [sujet] pour [public]. Structure : une accroche de 10 secondes, 4 parties avec un exemple chacune, une conclusion avec appel à l’action. Langue : français parlé et simple. Indique aussi les images à montrer pour chaque partie.", "q": {"q": "Que faire pour la musique d’une vidéo ?", "o": ["Prendre n’importe quelle chanson", "Utiliser une musique dont vous avez le droit", "Ne jamais mettre de son"], "a": 1, "e": "Une musique sans autorisation peut bloquer ou supprimer la vidéo."}}, {"t": "Publier, analyser et progresser", "d": "Régularité, statistiques et plan sur 30 jours", "b": ["Mieux vaut une vidéo utile toutes les semaines que dix vidéos puis un long silence. Pour débuter, <b>1 à 2 vidéos par semaine</b> est un bon rythme.", "Dans <b>YouTube Studio</b>, regardez surtout :"], "l": ["<b>Taux de clics</b> : les gens cliquent-ils sur votre miniature ? S’il est faible, changez le titre ou la miniature.", "<b>Durée moyenne de visionnage</b> : les gens restent-ils ? S’ils partent vite, améliorez le début.", "<b>Rétention</b> : repérez le moment précis où les spectateurs quittent la vidéo."], "b2": ["Créez des <b>playlists</b> pour enchaîner vos vidéos, répondez aux commentaires et gardez ce qui marche.", "Respectez les règles de YouTube : pas de faux abonnés ou de fausses vues, pas de contenus copiés. La monétisation fait l’objet d’une formation séparée.", "<b>Mini-projet</b> : publiez 4 vidéos en 4 semaines, puis comparez leurs statistiques."], "p": "Voici les statistiques de mes 4 dernières vidéos YouTube : [collez le taux de clics, la durée moyenne de visionnage et les vues]. Analyse-les, dis-moi ce qui marche et ce qui ne marche pas, puis propose 3 améliorations pour les 30 prochains jours.", "q": {"q": "Que faire si le taux de clics est faible ?", "o": ["Changer le titre ou la miniature", "Supprimer la chaîne", "Ne rien changer"], "a": 0, "e": "Le titre et la miniature sont ce qui donne envie de cliquer."}}];
LS["12"]=[{"t": "Comprendre ChatGPT et les assistants IA", "d": "Ce qu’ils savent faire, et leurs limites", "b": ["ChatGPT est un <b>assistant IA</b> qui comprend vos demandes écrites et répond en langage naturel. Il a été entraîné sur de très grandes quantités de textes pour prédire la suite la plus probable. D’autres assistants (comme Claude ou Gemini) fonctionnent de façon très proche."], "l": ["<b>Il sait faire</b> : rédiger, résumer, traduire, expliquer, proposer des idées, corriger.", "<b>Il se trompe parfois</b> : il peut inventer une information avec assurance. On appelle cela une <b>hallucination</b>.", "<b>Il ne connaît pas tout</b> : ses connaissances s’arrêtent à une date, sauf s’il dispose d’une recherche web."], "b2": ["Retenez : l’IA est un <b>assistant</b>, pas un expert infaillible. Vous restez responsable de ce que vous utilisez et publiez."], "q": {"q": "Qu’est-ce qu’une hallucination ?", "o": ["Une réponse fausse présentée comme vraie", "Une image générée", "Une panne internet"], "a": 0, "e": "C’est pourquoi il faut vérifier les informations importantes."}}, {"t": "Bien écrire vos demandes (prompts)", "d": "Rôle, contexte, tâche, format et exemple", "b": ["Un <b>prompt</b> est la consigne que vous donnez à l’IA. Plus elle est précise, plus la réponse est utile. Cinq éléments font la différence :"], "l": ["<b>Rôle</b> : « Tu es un conseiller en recrutement… »", "<b>Contexte</b> : la situation, votre public, votre objectif.", "<b>Tâche</b> : ce que vous voulez exactement.", "<b>Format</b> : liste, tableau, longueur, ton.", "<b>Exemple</b> : un modèle de ce que vous aimez (facultatif)."], "b2": ["Comparez : « Écris un message » est vague. « Écris un message WhatsApp de 3 phrases pour relancer un client qui n’a pas répondu à mon devis, ton poli » donne un bon résultat du premier coup."], "p": "Tu es [rôle]. Contexte : [décrivez la situation et votre public]. Tâche : [ce que vous voulez]. Format : [liste / tableau / 150 mots]. Ton : [simple, poli, motivant]. Si des informations te manquent, pose-moi d’abord 3 questions.", "q": {"q": "Quelle demande donnera le meilleur résultat ?", "o": ["« Écris un texte »", "Une demande avec rôle, contexte, tâche et format", "« Fais quelque chose »"], "a": 1, "e": "La précision de la demande améliore la réponse."}}, {"t": "Itérer et affiner les réponses", "d": "Améliorer jusqu’au bon résultat", "b": ["La première réponse est rarement parfaite : une conversation avec l’IA sert à <b>affiner</b>. Voici des phrases très efficaces :"], "l": ["« Rends-le plus court et plus simple. »", "« Donne-moi 3 versions différentes. »", "« Explique-moi cela étape par étape. »", "« Adopte un ton plus chaleureux. »", "« Qu’est-ce qui manque dans ta réponse ? »"], "b2": ["Si la réponse s’éloigne de ce que vous voulez, ne recommencez pas à zéro : <b>corrigez précisément</b> (« garde la partie 1, change la partie 2 »). Vous pouvez aussi demander à l’IA de vous poser des questions pour mieux comprendre votre besoin."], "p": "Voici ton texte : [collez la réponse]. Améliore-le ainsi : plus court (100 mots maximum), plus simple, avec 2 exemples concrets. Propose-moi ensuite 2 autres versions avec des tons différents, puis dis-moi ce que tu changerais encore.", "q": {"q": "Que faire si la réponse ne vous convient pas ?", "o": ["Abandonner", "Demander une correction précise", "Copier sans lire"], "a": 1, "e": "On affine la réponse en précisant ce qui change."}}, {"t": "L’IA au quotidien et au travail", "d": "E-mails, résumés, apprentissage et organisation", "b": ["Voici des usages qui font gagner du temps tous les jours :"], "l": ["Rédiger ou corriger un <b>e-mail</b> ou un message professionnel.", "<b>Résumer</b> un long texte ou préparer un compte rendu.", "Créer un <b>plan</b> de travail, une liste de tâches ou un planning.", "<b>Apprendre</b> : demander une explication simple, des exercices, un quiz.", "<b>Traduire</b> et reformuler un texte."], "b2": ["Bonne méthode : faites un premier jet avec l’IA, puis <b>relisez, corrigez et adaptez</b> avec votre expérience. Pour un sujet important (santé, argent, droit), vérifiez toujours auprès d’une source fiable ou d’un professionnel."], "p": "Tu es mon assistant de travail. Résume le texte suivant en 5 points clés, puis propose-moi 3 actions concrètes à faire cette semaine. Texte : [collez le texte, sans informations confidentielles].", "q": {"q": "Comment utiliser l’IA pour un sujet de santé ou d’argent ?", "o": ["Croire la réponse sans vérifier", "Vérifier avec une source fiable ou un professionnel", "Ne poser aucune question"], "a": 1, "e": "Pour les sujets sensibles, la vérification est indispensable."}}, {"t": "Créer du contenu et vendre avec l’IA", "d": "Publications, fiches produits et messages clients", "b": ["Pour une activité en ligne, l’IA vous aide à produire plus vite :"], "l": ["<b>Publications</b> pour les réseaux sociaux, avec accroche et appel à l’action.", "<b>Fiches produits</b> claires, avec bénéfices et caractéristiques.", "<b>Réponses aux clients</b> sur WhatsApp : salutations, prix, relances polies.", "<b>Scripts de vidéos</b> courts ou longs.", "<b>Idées d’offres</b> et de promotions."], "b2": ["Donnez toujours à l’IA <b>votre style et votre vrai contexte</b> (vos produits, vos prix, votre ton). Relisez avant d’envoyer : n’inventez jamais de promesses, de résultats ou d’avis clients."], "p": "Tu es un vendeur sympathique et honnête. Rédige 3 réponses WhatsApp de 2 à 3 phrases pour un client qui demande le prix de [produit ou service]. Prix réel : [prix]. Ton : chaleureux et professionnel. Termine chaque réponse par une question pour continuer la conversation.", "q": {"q": "Que faut-il éviter dans un message de vente écrit avec l’IA ?", "o": ["Donner des informations réelles", "Inventer des résultats ou de faux avis", "Utiliser un ton poli"], "a": 1, "e": "Les fausses promesses détruisent la confiance et peuvent poser des problèmes."}}, {"t": "Fiabilité, confidentialité et bonnes pratiques", "d": "Utiliser l’IA de façon sûre et responsable", "b": ["Trois réflexes à garder toujours :"], "l": ["<b>Vérifier</b> : chiffres, dates, noms et lois doivent être contrôlés avant d’être utilisés.", "<b>Protéger vos données</b> : n’envoyez ni mots de passe, ni informations bancaires, ni dossiers confidentiels de clients. Consultez les réglages de confidentialité de l’outil.", "<b>Être transparent</b> : précisez que le contenu a été fait avec l’IA quand c’est important, et ne vous attribuez pas le travail des autres."], "b2": ["Gardez vos meilleurs prompts dans un document : c’est votre <b>bibliothèque personnelle</b>, qui vous fera gagner du temps.", "<b>Mini-projet</b> : choisissez une tâche répétitive de votre semaine, écrivez un prompt complet, améliorez-le trois fois, puis enregistrez-le dans votre bibliothèque."], "p": "Relis la réponse que tu viens de me donner. Indique : 1) les informations dont tu n’es pas sûr, 2) ce que je dois vérifier auprès d’une source fiable, 3) ce que tu as peut-être inventé. Sois honnête.", "q": {"q": "Quelle information ne faut-il pas envoyer à une IA ?", "o": ["Une question générale", "Un mot de passe ou des données confidentielles", "Un brouillon sans données personnelles"], "a": 1, "e": "Les données sensibles doivent rester protégées."}}];
LS["3"]=[{"t": "Comprendre la vidéo IA", "d": "Ce qu’elle sait faire et ses limites", "b": ["La vidéo IA regroupe plusieurs techniques : transformer un <b>texte en vidéo</b>, animer une <b>image</b>, créer une <b>voix off</b>, générer des <b>sous-titres</b> ou assembler automatiquement des scènes. Elle permet de produire des vidéos sans caméra ni équipe."], "l": ["<b>Utile pour</b> : publicités courtes, explications, illustrations, vidéos pour les réseaux sociaux.", "<b>Limites</b> : clips très courts, mains et visages parfois imparfaits, texte mal écrit dans l’image, style qui change d’un clip à l’autre."], "b2": ["Une bonne vidéo IA combine <b>une idée claire, un bon script et un montage soigné</b>. L’outil ne remplace pas votre réflexion : il accélère la fabrication."], "q": {"q": "Qu’est-ce qui fait une bonne vidéo IA ?", "o": ["Seulement l’outil le plus cher", "Une idée claire, un bon script et un bon montage", "Un clip très long sans plan"], "a": 1, "e": "L’IA accélère la production, mais l’idée et le montage restent essentiels."}}, {"t": "Préparer l’idée et le script", "d": "Du message au plan de scènes", "b": ["Avant de générer quoi que ce soit, répondez à trois questions : <b>pour qui</b> est la vidéo, <b>quel message</b> doit rester en mémoire, <b>quelle action</b> voulez-vous provoquer (écrire sur WhatsApp, s’abonner, acheter) ?", "Découpez ensuite la vidéo en <b>scènes</b> de quelques secondes. Ce plan s’appelle un <b>storyboard</b> : pour chaque scène, notez ce qu’on voit, ce qu’on entend et le texte à l’écran."], "p": "Tu es un réalisateur de vidéos publicitaires courtes. Crée le plan d’une vidéo de 30 secondes pour [produit ou service], destinée à [public]. Donne 6 scènes de 5 secondes. Pour chaque scène : ce qu’on voit, la phrase de voix off, le texte à l’écran. Termine par un appel à l’action.", "q": {"q": "À quoi sert un storyboard ?", "o": ["À découper la vidéo en scènes avant de la créer", "À choisir la couleur du logo", "À publier plus vite sans réfléchir"], "a": 0, "e": "Il donne le plan de chaque scène."}}, {"t": "Écrire des prompts vidéo efficaces", "d": "Sujet, action, décor, style et caméra", "b": ["Un prompt vidéo doit être <b>simple et précis</b>. Décrivez ces éléments :"], "l": ["<b>Sujet</b> : qui ou quoi est dans la scène.", "<b>Action</b> : un seul mouvement clair par clip.", "<b>Décor</b> : lieu, ambiance, moment de la journée.", "<b>Style</b> : réaliste, dessin animé, publicité moderne.", "<b>Caméra</b> : plan large, gros plan, mouvement lent.", "<b>Format et durée</b> : vertical ou horizontal, quelques secondes."], "b2": ["Une idée par clip fonctionne mieux qu’une scène compliquée. Si le résultat est mauvais, simplifiez le prompt au lieu de l’allonger. Générez plusieurs essais et gardez le meilleur."], "p": "Un clip vidéo vertical de 5 secondes : [sujet] qui [action simple] dans [décor]. Style : réaliste, lumière naturelle douce. Caméra : plan moyen, mouvement lent vers l’avant. Pas de texte dans l’image et pas de visage d’une personne réelle.", "q": {"q": "Comment obtenir un meilleur clip ?", "o": ["Mettre plusieurs actions compliquées", "Décrire une seule action claire et réessayer", "Écrire un prompt de 10 pages"], "a": 1, "e": "Un prompt simple et précis donne un clip plus fiable."}}, {"t": "Voix, musique et sous-titres", "d": "Donner du rythme à votre vidéo", "b": ["Le son compte autant que l’image. Pour la <b>voix off</b>, vous pouvez enregistrer votre propre voix ou utiliser une voix générée par IA. Choisissez une voix claire, au rythme naturel, et faites relire le texte à voix haute.", "Pour la <b>musique</b>, utilisez uniquement des sons dont vous avez le droit (musique libre de droits ou fournie par la plateforme). Une chanson copiée peut faire bloquer ou supprimer votre vidéo.", "Ajoutez des <b>sous-titres</b> : beaucoup de gens regardent sans le son. Relisez-les, car les sous-titres automatiques contiennent des erreurs."], "p": "Réécris ce texte de voix off pour qu’il soit facile à dire à l’oral : phrases courtes, mots simples, rythme naturel, 30 secondes maximum. Texte : [collez votre texte].", "q": {"q": "Que faire avec les sous-titres automatiques ?", "o": ["Les publier sans relire", "Les relire et les corriger", "Les supprimer toujours"], "a": 1, "e": "Les sous-titres automatiques peuvent contenir des erreurs."}}, {"t": "Montage et assemblage", "d": "Du clip brut à la vidéo finie", "b": ["Le montage donne sa force à la vidéo. Avec une application comme CapCut, vous pouvez assembler vos clips, ajouter la voix, la musique et les sous-titres."], "l": ["Gardez des <b>plans courts</b> et un rythme vif.", "Coupez tout ce qui ne sert pas le message.", "Gardez un <b>style cohérent</b> d’un clip à l’autre (couleurs, ambiance).", "Ajoutez votre <b>logo</b> discrètement et un appel à l’action à la fin.", "Exportez dans le bon format : vertical pour TikTok, Facebook et YouTube Shorts, horizontal pour YouTube."], "b2": ["Regardez la vidéo finale <b>sur votre téléphone</b>, avec et sans le son, avant de la publier."], "q": {"q": "Quel format pour une vidéo TikTok ou Shorts ?", "o": ["Vertical", "Carré uniquement", "Horizontal très large"], "a": 0, "e": "Le format vertical est le plus adapté aux téléphones."}}, {"t": "Éthique, droits et publication", "d": "Utiliser la vidéo IA de façon responsable", "b": ["La vidéo IA est puissante, donc les règles comptent :"], "l": ["<b>Pas de faux contenus</b> : ne créez jamais une vidéo qui imite une vraie personne (visage ou voix) sans son accord, ni qui peut tromper le public.", "<b>Transparence</b> : indiquez quand un contenu réaliste est créé ou modifié par l’IA, en suivant les options de la plateforme.", "<b>Droits</b> : pas de personnages, logos ou musiques protégés sans autorisation.", "<b>Vérité</b> : ne montrez pas un produit ou un résultat qui n’existe pas."], "b2": ["Vérifiez aussi les conditions d’utilisation de l’outil, notamment pour un usage commercial.", "<b>Mini-projet</b> : créez une vidéo de 30 secondes avec 6 scènes, publiez-la, puis regardez combien de temps les gens la regardent."], "q": {"q": "Peut-on utiliser le visage d’une personne réelle dans une vidéo IA ?", "o": ["Oui, sans lui demander", "Seulement avec son accord", "Oui si c’est une célébrité"], "a": 1, "e": "Utiliser l’image d’une personne sans accord est interdit ou risqué."}}];
LS["17"]=[{"t": "Comprendre les générateurs d’images IA", "d": "Du texte à l’image", "b": ["Un générateur d’images IA crée une image à partir d’une description écrite. Il apprend à partir d’énormes collections d’images, puis compose une nouvelle image qui correspond à votre demande."], "l": ["<b>Utile pour</b> : publications, affiches, couvertures, illustrations, ambiances de produits.", "<b>Limites</b> : mains et visages parfois déformés, texte mal écrit, détails qui changent d’une image à l’autre."], "b2": ["Comme pour tout outil, le résultat dépend de la <b>qualité de votre demande</b> et de votre <b>tri</b> : générez plusieurs essais et gardez le meilleur."], "q": {"q": "Quelle limite est fréquente avec les images IA ?", "o": ["Elles sont toujours parfaites", "Le texte dans l’image est souvent mal écrit", "Elles n’ont jamais de couleurs"], "a": 1, "e": "Il vaut mieux ajouter le texte soi-même avec une application de design."}}, {"t": "Écrire le prompt d’une image", "d": "Sujet, style, lumière, couleurs et format", "b": ["Un bon prompt d’image décrit six choses :"], "l": ["<b>Sujet</b> : ce qu’on voit, avec des détails.", "<b>Style</b> : photo réaliste, illustration, 3D, minimaliste.", "<b>Lumière</b> : douce, dorée, studio, nocturne.", "<b>Couleurs</b> : votre palette de marque.", "<b>Composition</b> : plan large, gros plan, espace vide pour du texte.", "<b>Format</b> : carré, vertical, horizontal."], "b2": ["Précisez aussi ce que vous ne voulez pas : « sans texte », « sans logo », « sans visage d’une personne réelle »."], "p": "[Sujet détaillé], style [photo réaliste / illustration moderne], lumière [douce et dorée], couleurs dominantes [vos couleurs], composition [plan moyen, espace vide en haut pour un titre], format vertical 4:5. Sans texte, sans logo, sans visage d’une personne réelle.", "q": {"q": "Pourquoi préciser « sans texte » dans le prompt ?", "o": ["Parce que le texte généré est souvent mal écrit", "Parce que le texte est interdit", "Pour rendre l’image floue"], "a": 0, "e": "Vous ajouterez ensuite le texte proprement vous-même."}}, {"t": "Garder un style cohérent", "d": "Une identité visuelle reconnaissable", "b": ["Une marque forte se reconnaît d’un coup d’œil. Pour que vos images se ressemblent :"], "l": ["Choisissez <b>3 couleurs</b> principales et gardez-les.", "Utilisez toujours le <b>même style</b> (par exemple : illustration plate ou photo réaliste).", "Gardez les <b>mêmes mots de style</b> dans tous vos prompts.", "Réservez de l’espace au même endroit pour le titre et le logo.", "Enregistrez vos meilleurs prompts dans un document."], "b2": ["Si votre outil permet d’utiliser une image de référence, servez-vous-en pour garder la même ambiance sur toute une série."], "p": "Crée un guide de style pour mes images de réseaux sociales. Activité : [activité]. Public : [public]. Donne 3 couleurs avec leurs codes, 5 mots décrivant le style, des règles de composition et un modèle de prompt réutilisable que je pourrai copier à chaque image.", "q": {"q": "Comment rendre vos images reconnaissables ?", "o": ["Changer de style chaque jour", "Garder couleurs, style et composition cohérents", "Utiliser des couleurs au hasard"], "a": 1, "e": "La cohérence crée l’identité de votre marque."}}, {"t": "Améliorer et retoucher", "d": "Du bon essai à l’image finale", "b": ["Vous obtiendrez rarement l’image parfaite du premier coup. Voici la méthode :"], "l": ["Générez <b>plusieurs variantes</b> et choisissez la meilleure.", "<b>Zoomez</b> pour vérifier les mains, les visages et les détails.", "Corrigez ou recadrez l’image avec une application de retouche.", "Ajoutez <b>votre texte</b> et votre logo avec une application de design : l’orthographe sera correcte.", "Exportez au bon format et à la bonne taille pour chaque réseau."], "b2": ["Regardez toujours l’image <b>en petit</b>, comme sur un téléphone : si elle reste lisible, elle est prête."], "q": {"q": "Comment obtenir un texte propre sur l’image ?", "o": ["Le faire écrire par l’IA à chaque fois", "L’ajouter soi-même avec une application de design", "Ne jamais mettre de texte"], "a": 1, "e": "Vous contrôlez ainsi l’orthographe."}}, {"t": "Images pour vendre", "d": "Visuels de produits et publicités honnêtes", "b": ["L’IA peut créer des <b>ambiances</b> pour vos produits : un fond élégant, une mise en scène, une affiche promotionnelle. Mais l’honnêteté reste essentielle."], "l": ["Ne montrez pas un produit <b>différent du vrai</b> : le client doit recevoir ce qu’il voit.", "N’inventez pas de résultats, de témoignages ou de photos « avant/après » truqués.", "Utilisez de vraies photos de vos produits quand c’est possible, et l’IA pour le fond ou l’ambiance.", "Placez votre prix, votre contact et un appel à l’action avec une application de design."], "b2": ["Un client trompé revient rarement et peut signaler votre page. La confiance vaut plus qu’une belle image."], "p": "Crée l’image d’une ambiance pour une publication Facebook : un fond [élégant, lumineux] pour mettre en valeur [type de produit]. Espace vide au centre pour placer la vraie photo du produit. Couleurs : [vos couleurs]. Format carré. Sans texte.", "q": {"q": "Que faire pour un visuel de vente honnête ?", "o": ["Montrer un produit différent du vrai", "Montrer le vrai produit, avec une ambiance créée par l’IA", "Inventer de faux avis"], "a": 1, "e": "Le client doit recevoir ce qu’il voit."}}, {"t": "Droits, éthique et organisation", "d": "Utiliser les images IA en toute sécurité", "b": ["Quelques règles pour éviter les problèmes :"], "l": ["<b>Personnes réelles</b> : ne créez pas d’images qui imitent une personne réelle sans son accord.", "<b>Marques et personnages</b> : n’utilisez pas de logos, de personnages ou d’œuvres protégés sans autorisation.", "<b>Licence</b> : lisez les conditions de l’outil pour savoir si vous pouvez utiliser les images pour vendre.", "<b>Transparence</b> : indiquez que l’image est générée par l’IA quand elle pourrait être prise pour une vraie photo."], "b2": ["Classez vos images dans des dossiers (par projet, par date) et gardez vos prompts : cela vous fera gagner beaucoup de temps.", "<b>Mini-projet</b> : créez 10 images cohérentes pour votre page, avec le même style et vos couleurs, puis publiez-en une par jour."], "q": {"q": "Que faut-il vérifier avant de vendre avec des images IA ?", "o": ["Les conditions d’utilisation de l’outil", "La météo", "Rien du tout"], "a": 0, "e": "Certaines licences limitent l’usage commercial."}}];
LS["4"]=[{"t": "Comprendre ce qu’est un bon logo", "d": "Simple, lisible, mémorable", "b": ["Un logo est le signe qui représente votre activité. Un bon logo est <b>simple</b>, <b>lisible</b> même en tout petit, <b>mémorable</b> et utilisable partout : réseaux sociaux, cartes de visite, affiches, factures."], "l": ["<b>Logo lettres</b> : le nom ou les initiales.", "<b>Symbole</b> : une icône seule.", "<b>Combiné</b> : une icône avec le nom."], "b2": ["Les grandes marques ont presque toujours des logos très simples : peu de couleurs, peu de détails. Un logo trop chargé devient illisible sur un petit écran."], "q": {"q": "Qu’est-ce qui rend un logo efficace ?", "o": ["Beaucoup de détails", "Il est simple, lisible et mémorable", "Il utilise dix couleurs"], "a": 1, "e": "La simplicité fait la force d’un logo."}}, {"t": "Préparer votre identité de marque", "d": "Nom, valeurs, public et couleurs", "b": ["Avant de créer le logo, définissez votre marque : le <b>nom</b>, l’<b>activité</b>, le <b>public</b> et <b>3 mots</b> qui décrivent votre ambiance (par exemple : moderne, fiable, chaleureux).", "Choisissez ensuite vos <b>couleurs</b> : chaque couleur donne une impression. Le vert évoque souvent la nature, la croissance et la confiance ; le bleu, le sérieux ; le doré ou le jaune, la valeur et l’énergie. Limitez-vous à 2 ou 3 couleurs."], "p": "Tu es un directeur artistique. Aide-moi à définir l’identité visuelle de [nom de la marque], qui propose [activité] à [public]. Propose 3 directions : pour chacune, 3 mots d’ambiance, une palette de 3 couleurs avec leurs codes, un style de forme (arrondi, géométrique…) et un style de typographie.", "q": {"q": "Combien de couleurs principales garder pour un logo ?", "o": ["2 ou 3", "10", "Aucune"], "a": 0, "e": "Peu de couleurs rendent le logo plus simple et plus reconnaissable."}}, {"t": "Générer des idées de logos avec l’IA", "d": "Prompts et premiers concepts", "b": ["Utilisez l’IA pour explorer beaucoup d’idées rapidement. Dans votre prompt, précisez :"], "l": ["Le <b>type</b> de logo (symbole, lettres, combiné).", "La <b>forme</b> ou l’idée principale (un livre, une feuille, une puce, une étoile).", "Le <b>style</b> (minimaliste, moderne, plat, sans dégradé).", "Les <b>couleurs</b> exactes de votre palette.", "Un <b>fond uni</b> pour pouvoir le détourer facilement."], "b2": ["Les générateurs d’images écrivent souvent mal le nom de la marque : générez plutôt le <b>symbole</b>, puis ajoutez le nom vous-même avec une application de design.", "Générez 15 à 20 concepts, notez ceux qui vous plaisent, puis mélangez les meilleures idées."], "p": "Logo minimaliste pour une marque de [activité] : symbole [idée principale], style plat et moderne, formes simples, couleurs [vos couleurs], fond blanc uni, sans texte, sans dégradé, sans ombre, centré, vue de face.", "q": {"q": "Pourquoi générer le symbole sans le nom ?", "o": ["Parce que le nom est mal écrit par l’IA", "Parce que le nom est interdit", "Parce que le logo serait trop beau"], "a": 0, "e": "Vous ajouterez le nom proprement avec une police claire."}}, {"t": "Affiner et finaliser votre logo", "d": "Simplifier, tester et préparer les versions", "b": ["Choisissez 1 ou 2 concepts et améliorez-les :"], "l": ["<b>Simplifiez</b> : retirez les détails inutiles.", "<b>Testez en petit</b> : le logo doit rester lisible en taille de photo de profil.", "<b>Testez en noir et blanc</b> : il doit fonctionner même sans couleur.", "<b>Ajoutez le nom</b> avec une police claire dans une application de design.", "Préparez plusieurs versions : en couleur, en noir et blanc, sur fond clair et sur fond sombre."], "b2": ["Exportez votre logo en <b>PNG avec fond transparent</b> pour l’utiliser partout. Si possible, gardez aussi une version vectorielle (SVG), qui s’agrandit sans perdre en qualité."], "q": {"q": "Comment vérifier qu’un logo est assez simple ?", "o": ["Le regarder en petit et en noir et blanc", "Le mettre sur un mur géant", "Ajouter plus de détails"], "a": 0, "e": "S’il reste lisible en petit et sans couleur, il est solide."}}, {"t": "Vérifier l’originalité et les droits", "d": "Éviter de copier une marque existante", "b": ["Un logo doit être <b>unique</b>. Avant de l’adopter :"], "l": ["Faites une <b>recherche d’image inversée</b> pour vérifier qu’il ne ressemble pas à une marque connue.", "Cherchez des marques proches dans votre domaine.", "Pour protéger légalement votre marque, renseignez-vous auprès de l’organisme de propriété intellectuelle de votre pays ou de votre région (par exemple l’OAPI pour l’Afrique francophone de l’Ouest et du Centre).", "Lisez les conditions de l’outil d’IA pour savoir si vous pouvez utiliser le logo à des fins commerciales."], "b2": ["Gardez vos fichiers sources et vos prompts : ils prouvent votre travail de création. Pour des questions juridiques précises, consultez un professionnel."], "q": {"q": "Que faire avant d’adopter un logo ?", "o": ["Vérifier qu’il ne copie pas une marque existante", "Le copier sur une grande marque", "Ne rien vérifier"], "a": 0, "e": "Un logo trop proche d’une autre marque peut poser des problèmes."}}, {"t": "Utiliser votre logo partout", "d": "Supports et mini guide de style", "b": ["Votre logo doit apparaître de façon <b>cohérente</b> sur tous vos supports : photo de profil, bannière, cartes de visite, affiches, factures, vidéos."], "l": ["Gardez toujours les <b>mêmes couleurs</b> et la même police.", "Laissez de l’<b>espace autour</b> du logo, sans le déformer.", "Ne le placez pas sur un fond qui le rend illisible.", "Notez vos codes de couleurs et vos polices dans un petit <b>guide de style</b>."], "b2": ["<b>Mini-projet</b> : finalisez votre logo, créez-en trois versions (couleur, noir et blanc, fond sombre), puis utilisez-le sur votre page, votre carte de visite et une affiche."], "p": "Crée un mini guide de style pour ma marque [nom]. Donne : la description du logo et ses versions, les couleurs avec leurs codes, la police principale, les règles d’utilisation (espaces, fonds interdits) et 3 exemples de supports où l’utiliser.", "q": {"q": "Pourquoi garder les mêmes couleurs et polices partout ?", "o": ["Pour être reconnaissable", "Pour économiser du papier", "Ça n’a aucune importance"], "a": 0, "e": "La cohérence rend la marque reconnaissable."}}];
LS["5"]=[{"t": "Les bases d’une bonne affiche", "d": "Un message, une hiérarchie, une lecture facile", "b": ["Une affiche est vue en quelques secondes. Elle doit donc faire passer <b>un seul message</b> et être lue de loin ou sur un petit écran."], "l": ["<b>Un message principal</b> : le titre, bien visible.", "<b>Une hiérarchie</b> : titre, puis détails, puis contact.", "<b>Du contraste</b> : texte clair sur fond foncé, ou l’inverse.", "<b>Des espaces vides</b> : une affiche aérée se lit mieux.", "<b>Peu de polices</b> : 2 maximum."], "b2": ["Si l’on doit réfléchir pour comprendre l’affiche, elle est trop chargée. Enlevez tout ce qui n’aide pas le message."], "q": {"q": "Combien de messages principaux une affiche doit-elle avoir ?", "o": ["Un seul", "Dix", "Aucun"], "a": 0, "e": "Un message unique est compris plus vite."}}, {"t": "Préparer le contenu de l’affiche", "d": "Titre, détails, appel à l’action et contact", "b": ["Avant le design, écrivez le texte. Une affiche efficace contient :"], "l": ["Un <b>titre</b> court qui promet un bénéfice.", "Un <b>sous-titre</b> ou 2 à 3 informations clés (date, lieu, prix, avantage).", "Un <b>appel à l’action</b> : « Appelez », « Écrivez-nous sur WhatsApp », « Réservez ».", "Vos <b>coordonnées</b> et votre logo."], "b2": ["Relisez chaque chiffre (prix, date, numéro de téléphone) : une erreur sur l’affiche coûte cher, surtout si elle est imprimée."], "p": "Tu es un copywriter. Écris le texte d’une affiche pour [événement ou offre], destinée à [public]. Donne : 5 titres de moins de 6 mots, un sous-titre, 3 informations clés, un appel à l’action et une phrase de contact. Ton : [dynamique et simple].", "q": {"q": "Que doit contenir l’appel à l’action ?", "o": ["Ce que le lecteur doit faire ensuite", "Votre biographie", "Un long paragraphe"], "a": 0, "e": "Il dit clairement comment réagir."}}, {"t": "Créer le visuel avec l’IA", "d": "Un fond fort, sans texte", "b": ["Utilisez l’IA pour générer le <b>visuel principal</b> : une ambiance, un décor, un produit mis en scène. Les générateurs écrivent souvent mal le texte, donc demandez toujours une image <b>sans texte</b>.", "Laissez de la place : demandez un <b>espace vide</b> en haut ou en bas pour votre titre. Respectez vos couleurs de marque."], "p": "Image pour une affiche [thème], style [moderne / chaleureux / luxueux], couleurs dominantes [vos couleurs], lumière douce, composition avec un grand espace vide en haut pour un titre. Format vertical 3:4. Sans aucun texte, sans logo, sans visage d’une personne réelle.", "q": {"q": "Pourquoi laisser un espace vide dans l’image ?", "o": ["Pour y placer le titre", "Pour économiser l’encre", "Pour cacher des erreurs"], "a": 0, "e": "L’espace vide accueille votre titre et vos informations."}}, {"t": "Mise en page et typographie", "d": "Ajouter votre texte avec une application de design", "b": ["Ouvrez une application de design (par exemple Canva) et placez votre image en fond. Ajoutez ensuite le texte :"], "l": ["Choisissez <b>2 polices au plus</b> : une pour le titre, une pour les détails.", "Utilisez de <b>grandes tailles</b> pour le titre et des tailles plus petites pour le reste.", "Vérifiez le <b>contraste</b> : le texte doit se lire sans effort.", "<b>Alignez</b> les éléments et gardez des marges.", "Placez le <b>logo</b> et le contact à un endroit constant."], "b2": ["Regardez l’affiche en <b>petit</b>, comme sur un téléphone : le titre doit encore être lisible."], "q": {"q": "Combien de polices utiliser en général ?", "o": ["Deux au maximum", "Au moins dix", "Aucune"], "a": 0, "e": "Trop de polices rendent l’affiche confuse."}}, {"t": "Formats et impression", "d": "Du bon format au bon fichier", "b": ["Le format dépend de l’usage :"], "l": ["<b>Impression</b> : A4 ou A3, fichier PDF, résolution d’environ 300 points par pouce.", "<b>Publication Facebook</b> : carré ou vertical 4:5.", "<b>Story ou TikTok</b> : vertical 9:16."], "b2": ["Pour imprimer, demandez conseil à l’imprimeur : <b>marges</b>, <b>fond perdu</b> (le bord de l’image qui dépasse pour éviter les bandes blanches) et format du fichier. Les couleurs à l’écran sont souvent plus vives qu’à l’impression : demandez un test sur une seule feuille avant d’imprimer en quantité."], "q": {"q": "Que faire avant d’imprimer 100 affiches ?", "o": ["Imprimer un test", "Imprimer sans relire", "Changer toutes les couleurs"], "a": 0, "e": "Un test évite des erreurs coûteuses."}}, {"t": "Vérifier, diffuser et mesurer", "d": "Relecture, droits et résultats", "b": ["Avant de diffuser, faites cette vérification :"], "l": ["<b>Orthographe</b> : relisez, et faites relire par une autre personne.", "<b>Informations</b> : prix, dates, adresses, numéro de téléphone.", "<b>Droits</b> : pas de photo, logo ou personnage protégé utilisé sans autorisation.", "<b>Honnêteté</b> : ne promettez rien que vous ne pouvez pas tenir."], "b2": ["Pour mesurer l’effet, ajoutez un moyen de suivi : un numéro WhatsApp dédié, un code promo ou un QR code. Comparez deux versions (titre différent) et gardez la meilleure.", "<b>Mini-projet</b> : créez 3 affiches pour la même offre avec des titres différents, diffusez-les, puis voyez laquelle fait le plus réagir."], "p": "Relis le texte de cette affiche et signale toutes les fautes d’orthographe, les phrases trop longues et les informations manquantes (date, lieu, prix, contact). Texte : [collez le texte].", "q": {"q": "Comment savoir quelle affiche marche le mieux ?", "o": ["Comparer les réactions avec un suivi (QR, WhatsApp, code promo)", "Au hasard", "En ne diffusant jamais"], "a": 0, "e": "Un suivi permet de comparer les versions."}}];
LS["7"]=[{"t": "Comprendre le business avec l’IA", "d": "Ce que l’IA aide à faire, et ce qu’elle ne fait pas", "b": ["L’IA est un assistant pour votre activité. Elle peut vous aider à <b>trouver des idées</b>, étudier un marché, écrire des offres et des messages, préparer des plans et répondre plus vite aux clients."], "l": ["<b>Elle aide pour</b> : brainstorming, rédaction, organisation, analyse de textes.", "<b>Elle ne remplace pas</b> : le contact avec de vrais clients, votre connaissance du terrain, la qualité de votre produit ou service."], "b2": ["Méfiez-vous des promesses de « gains faciles et rapides » : un business solide demande du travail, un vrai produit et de la patience. Cette formation ne promet aucun revenu précis."], "q": {"q": "Que ne peut pas remplacer l’IA ?", "o": ["Le contact avec de vrais clients et la qualité de l’offre", "L’orthographe", "La rédaction d’un e-mail"], "a": 0, "e": "L’IA vous aide, mais le business se construit avec le réel."}}, {"t": "Trouver et valider une idée", "d": "Un vrai problème pour de vrais clients", "b": ["Une bonne idée résout un <b>problème précis</b> pour un <b>groupe précis</b> de personnes qui sont prêtes à payer pour une solution. Trois questions : qui, quel problème, pourquoi paieraient-ils ?", "Avant d’investir, <b>testez</b> : parlez à 5 à 10 clients possibles, présentez votre idée et notez leurs réactions. S’ils n’en veulent pas, changez l’idée avant de dépenser de l’argent."], "p": "Tu es un conseiller en création d’entreprise. Mes compétences : [compétences]. Ma ville ou région : [lieu]. Mon budget de départ : [montant]. Propose 8 idées d’activité réalistes avec, pour chacune : le client visé, le problème résolu, ce qu’il faut pour démarrer et un risque principal. Pose-moi 3 questions si tu manques d’informations.", "q": {"q": "Que faire avant d’investir dans une idée ?", "o": ["La tester auprès de vrais clients possibles", "Emprunter le maximum", "Ne parler à personne"], "a": 0, "e": "Un test réel évite de se tromper cher."}}, {"t": "Étude de marché et offre", "d": "Client idéal, concurrence, prix et valeur", "b": ["Décrivez votre <b>client idéal</b> : qui est-il, que cherche-t-il, que paie-t-il déjà aujourd’hui ? Regardez la <b>concurrence</b> : quels sont leurs prix et leurs points faibles ?", "Construisez votre <b>offre</b> : ce que vous vendez, le bénéfice pour le client et la raison de vous choisir. Pour le <b>prix</b>, additionnez vos coûts (matériel, temps, transport), ajoutez une marge, puis comparez avec le marché."], "b2": ["L’IA peut proposer des modèles de tableaux, mais vérifiez toujours les prix et les informations avec la réalité de votre ville."], "p": "Aide-moi à préparer mon offre. Activité : [activité]. Client idéal : [description]. Mes coûts par vente : [montant]. Propose : une phrase de promesse, 3 bénéfices clairs, 3 façons de me différencier des concurrents, une fourchette de prix et la méthode pour calculer ma marge. Rappelle-moi ce que je dois vérifier sur le terrain.", "q": {"q": "Comment fixer un prix ?", "o": ["Additionner les coûts, ajouter une marge et comparer au marché", "Choisir un prix au hasard", "Copier sans réfléchir"], "a": 0, "e": "Le prix doit couvrir vos coûts et rester acceptable pour le marché."}}, {"t": "Votre plan d’action sur une page", "d": "Offre, clients, canaux, budget et objectifs", "b": ["Un plan simple vaut mieux qu’un long document jamais lu. Une page suffit :"], "l": ["<b>Offre</b> : ce que vous vendez et à qui.", "<b>Canaux</b> : où vous trouvez vos clients (WhatsApp, Facebook, bouche à oreille…).", "<b>Budget</b> : ce dont vous avez besoin au départ.", "<b>Objectifs</b> : à 30 jours et à 90 jours, avec des chiffres simples.", "<b>Actions de la semaine</b> : 3 choses concrètes à faire."], "b2": ["Revoyez votre plan chaque semaine et ajustez selon ce qui marche."], "p": "Crée un plan d’action sur une page pour mon activité [activité] à [lieu]. Budget de départ : [montant]. Donne : l’offre, les canaux pour trouver des clients, le budget par poste, des objectifs à 30 et 90 jours, et 3 actions pour cette semaine. Format : tableau simple.", "q": {"q": "À quelle fréquence revoir son plan ?", "o": ["Chaque semaine", "Jamais", "Une fois en dix ans"], "a": 0, "e": "Un plan vivant s’adapte à la réalité."}}, {"t": "Communiquer et vendre", "d": "Présentation, messages et suivi des clients", "b": ["Préparez une <b>présentation courte</b> de votre activité en 3 phrases : qui vous aidez, comment, et le résultat pour eux. Servez-vous-en dans vos messages, sur vos réseaux et à l’oral.", "Pour vendre, écoutez d’abord le besoin, proposez une solution claire, donnez le prix, puis <b>relancez poliment</b> après quelques jours. Le suivi fait souvent la différence."], "b2": ["Soyez toujours honnête sur ce que vous proposez, les délais et les prix. La confiance fait revenir les clients et amène de nouveaux clients."], "p": "Écris 3 messages WhatsApp pour mon activité [activité] : 1) un premier message pour présenter mon offre à un nouveau client, 2) une relance polie après 3 jours sans réponse, 3) un message de remerciement après la vente. Ton : chaleureux et professionnel. Prix réel : [prix].", "q": {"q": "Que faire après un premier message sans réponse ?", "o": ["Relancer poliment", "Insulter le client", "Abandonner tout de suite"], "a": 0, "e": "Une relance polie montre du sérieux."}}, {"t": "Suivre, protéger et améliorer", "d": "Chiffres, règles et automatisation simple", "b": ["Notez chaque semaine vos <b>ventes</b>, vos <b>dépenses</b> et le <b>bénéfice</b>. Un simple tableau sur téléphone suffit. Ce qui n’est pas suivi ne s’améliore pas.", "Utilisez l’IA pour gagner du temps sur les tâches répétitives (messages, publications, comptes rendus), mais <b>n’envoyez jamais de données confidentielles</b> de clients ou de mots de passe.", "Renseignez-vous sur les <b>règles de votre pays</b> pour déclarer ou enregistrer votre activité : adressez-vous aux organismes officiels ou à un professionnel."], "b2": ["Méfiez-vous des arnaques qui promettent de gagner beaucoup d’argent sans effort, ou qui demandent de payer avant de recevoir quoi que ce soit.", "<b>Mini-projet</b> : rédigez votre plan d’une page, testez votre idée auprès de 5 personnes et notez leurs remarques."], "p": "Crée un tableau simple de suivi hebdomadaire pour mon activité : date, produit ou service vendu, prix, coût, bénéfice, client, remarque. Ajoute une ligne de total et 3 questions à me poser chaque semaine pour améliorer mon activité.", "q": {"q": "Que faire face à une promesse de gains faciles ?", "o": ["Se méfier", "Envoyer de l’argent tout de suite", "Partager ses mots de passe"], "a": 0, "e": "Les gains garantis sans effort sont un signal d’arnaque."}}];
LS["8"]=[{"t": "Les bases du marketing digital", "d": "Attirer, convaincre, vendre, fidéliser", "b": ["Le marketing digital, c’est utiliser internet pour <b>faire connaître</b> votre offre et <b>amener des clients</b>. Le parcours d’un client suit en général quatre étapes :"], "l": ["<b>Attirer</b> : il vous découvre (réseaux sociaux, recherche, bouche à oreille).", "<b>Convaincre</b> : il comprend votre offre et vous fait confiance.", "<b>Vendre</b> : il achète ou vous contacte.", "<b>Fidéliser</b> : il revient et vous recommande."], "b2": ["Vous n’avez pas besoin d’être partout. Choisissez <b>1 ou 2 canaux</b> où se trouve votre client idéal, et faites-les bien."], "q": {"q": "Combien de canaux choisir pour débuter ?", "o": ["Un ou deux, bien choisis", "Tous en même temps", "Aucun"], "a": 0, "e": "Mieux vaut bien utiliser peu de canaux."}}, {"t": "Connaître votre client idéal", "d": "Le persona et ses besoins", "b": ["Pour bien vendre, il faut bien connaître la personne que vous voulez aider. Décrivez votre <b>client idéal</b> (ce qu’on appelle un persona) :"], "l": ["Âge, métier, ville, revenus approximatifs.", "Son <b>problème principal</b> et ce qu’il a déjà essayé.", "Ce qui le <b>freine</b> pour acheter (prix, confiance, temps).", "Où il passe du temps : Facebook, TikTok, WhatsApp, YouTube…"], "b2": ["Si vous avez déjà des clients, appelez-en quelques-uns et posez-leur des questions. Leurs mots sont précieux pour écrire vos messages."], "p": "Aide-moi à créer le portrait de mon client idéal. Mon activité : [activité]. Ma ville : [lieu]. Décris 2 personas avec leur âge, leur métier, leur problème principal, leurs freins à l’achat, les réseaux qu’ils utilisent et 5 phrases qu’ils pourraient dire. Précise que ce sont des hypothèses à vérifier avec de vrais clients.", "q": {"q": "Que faire avec les hypothèses de l’IA sur vos clients ?", "o": ["Les vérifier avec de vrais clients", "Les considérer comme des vérités absolues", "Les ignorer sans lire"], "a": 0, "e": "L’IA propose, le terrain confirme."}}, {"t": "Votre message et votre offre", "d": "Bénéfices, preuves et appel à l’action", "b": ["Les clients n’achètent pas des caractéristiques, ils achètent des <b>résultats</b>. Dites ce que votre produit leur apporte : gain de temps, économie, confiance, tranquillité.", "Appuyez votre message sur des <b>preuves réelles</b> : témoignages, photos de vrais résultats, expérience. Terminez toujours par un <b>appel à l’action</b> clair."], "b2": ["N’inventez jamais de faux avis ni de faux résultats : c’est malhonnête, et cela peut vous être reproché."], "p": "Réécris l’offre suivante en mettant en avant les bénéfices pour le client plutôt que les caractéristiques. Offre : [décrivez]. Donne 3 versions courtes (50 mots), une pour Facebook, une pour WhatsApp et une pour une affiche, avec un appel à l’action clair. N’invente aucun chiffre ni témoignage.", "q": {"q": "Que doit mettre en avant un bon message ?", "o": ["Les résultats pour le client", "Seulement la liste technique", "Vos problèmes personnels"], "a": 0, "e": "Le client veut savoir ce qu’il y gagne."}}, {"t": "Contenu et réseaux sociaux", "d": "Piliers, calendrier et régularité", "b": ["Le contenu attire et rassure. Choisissez quelques <b>piliers</b> (conseils, histoires, preuves, offres) et publiez avec <b>régularité</b>. Un calendrier simple vous évite de manquer d’idées.", "Chaque réseau a son style : vidéos courtes sur TikTok, publications et groupes sur Facebook, vidéos plus longues sur YouTube. Reprenez ce que vous avez appris dans les formations qui leur sont dédiées."], "b2": ["Réutilisez un même contenu sous plusieurs formes : une idée peut devenir une publication, une courte vidéo et un message WhatsApp."], "p": "Crée un calendrier de contenu de 14 jours pour [activité] destiné à [public]. Pour chaque jour : le réseau (Facebook, TikTok ou WhatsApp), le type de publication, le sujet et une idée d’accroche. Alterne conseils, histoires, preuves et offres.", "q": {"q": "Comment gagner du temps avec le contenu ?", "o": ["Réutiliser une idée sous plusieurs formes", "Tout recommencer chaque jour", "Ne jamais planifier"], "a": 0, "e": "Une idée peut nourrir plusieurs contenus."}}, {"t": "WhatsApp et relation client", "d": "Répondre vite et fidéliser", "b": ["WhatsApp est souvent le lieu où la vente se conclut. Avec <b>WhatsApp Business</b>, vous pouvez créer un catalogue, des réponses rapides, un message d’accueil et des étiquettes pour classer vos clients.", "Répondez vite, soyez poli, confirmez le prix et le délai, puis demandez un avis après la livraison."], "b2": ["Respectez les personnes : <b>n’ajoutez pas les gens à des groupes ou à des listes sans leur accord</b>, et n’envoyez pas de messages en masse non désirés. Un client qui se sent respecté revient."], "p": "Crée 6 messages types pour WhatsApp Business pour [activité] : message d’accueil, réponse « quel est le prix ? », confirmation de commande, relance après devis, remerciement et demande d’avis. Ton : chaleureux et professionnel. Mets des champs à compléter entre crochets.", "q": {"q": "Que faut-il respecter avec les listes de contacts ?", "o": ["L’accord des personnes", "Rien du tout", "Seulement la couleur du logo"], "a": 0, "e": "On n’ajoute pas les gens sans leur consentement."}}, {"t": "Publicité payante et mesure", "d": "Tester avec un petit budget", "b": ["La publicité payante peut accélérer, mais elle demande de la méthode. Commencez petit :"], "l": ["Fixez un <b>objectif clair</b> : messages reçus, visites ou ventes.", "Choisissez un <b>petit budget de test</b>, que vous pouvez vous permettre de perdre.", "Testez <b>2 visuels et 2 textes</b> différents.", "Respectez les règles des plateformes (pas de promesses trompeuses).", "Arrêtez ce qui ne marche pas et gardez ce qui marche."], "b2": ["Mesurez : combien de personnes ont vu l’annonce, combien ont cliqué ou écrit, combien ont acheté, et combien chaque client vous a <b>coûté</b>. Si une vente rapporte moins que ce qu’elle coûte, ajustez.", "<b>Mini-projet</b> : lancez un test de 7 jours avec un petit budget et un objectif unique, puis notez les résultats chiffrés."], "p": "Aide-moi à préparer un test de publicité sur 7 jours pour [activité]. Objectif : [recevoir des messages WhatsApp]. Budget total : [petit montant]. Propose 2 textes d’annonce, 2 idées de visuels, un public cible et les chiffres à noter chaque jour. Rappelle-moi les règles de prudence.", "q": {"q": "Quel budget pour un premier test publicitaire ?", "o": ["Un petit montant que vous pouvez perdre", "Toutes vos économies", "Aucun suivi"], "a": 0, "e": "On teste d’abord petit, puis on ajuste."}}];
LS["18"]=[{"t": "Ce qu’un bon CV doit montrer", "d": "Clair, honnête et facile à lire", "b": ["Un recruteur lit un CV en quelques secondes. Il doit donc trouver très vite <b>qui vous êtes</b>, ce que vous savez faire et vos preuves. Le plus souvent, un CV tient sur <b>une page</b>."], "l": ["<b>Coordonnées</b> : nom, téléphone, e-mail, ville.", "<b>Titre ou profil</b> : 2 lignes sur ce que vous proposez.", "<b>Expériences</b> : de la plus récente à la plus ancienne.", "<b>Formations</b> et <b>compétences</b>.", "<b>Langues</b> et centres d’intérêt utiles."], "b2": ["L’usage de la photo dépend du pays et du poste : informez-vous. Dans tous les cas, ne mettez jamais de numéro de pièce d’identité."], "q": {"q": "Combien de pages vise un CV en général ?", "o": ["Une page", "Dix pages", "Aucune"], "a": 0, "e": "Un CV court se lit mieux."}}, {"t": "Rassembler vos informations", "d": "Transformer vos tâches en réalisations", "b": ["Listez tout ce que vous avez fait : emplois, stages, bénévolat, projets, formations. Pour chaque expérience, notez ce que vous avez <b>réalisé</b>, pas seulement vos tâches.", "Utilisez des <b>verbes d’action</b> (organisé, vendu, formé, réduit…) et des <b>chiffres vrais</b> quand vous en avez : « J’ai vendu 30 produits par mois » vaut mieux que « Je m’occupais de la vente »."], "p": "Voici mes tâches dans mon poste de [poste] : [liste vos tâches]. Aide-moi à les transformer en 4 réalisations commençant par un verbe d’action. N’invente aucun chiffre : pose-moi des questions si tu as besoin de précisions.", "q": {"q": "Que faut-il indiquer avec vos expériences ?", "o": ["Vos réalisations, avec des chiffres vrais", "Seulement des phrases vagues", "Des exploits inventés"], "a": 0, "e": "Les résultats réels convainquent mieux que les tâches."}}, {"t": "Rédiger avec l’IA et adapter à l’offre", "d": "Profil, expériences et mots-clés", "b": ["Collez l’<b>offre d’emploi</b> dans l’IA et demandez-lui d’adapter votre CV : elle repère les <b>mots-clés</b> importants et vous propose des formulations. Gardez uniquement ce qui est <b>vrai</b>.", "Règle absolue : <b>n’inventez jamais</b> un diplôme, une expérience ou une compétence. Cela peut être vérifié et vous faire perdre l’emploi."], "p": "Voici mon CV : [collez votre CV] et voici l’offre d’emploi : [collez l’offre]. Propose : 1) un profil de 3 lignes adapté à l’offre, 2) les mots-clés de l’offre que je peux ajouter si ils sont vrais, 3) les points à mettre en avant. N’invente rien, signale ce qui me manque.", "q": {"q": "Peut-on ajouter une compétence que l’on n’a pas ?", "o": ["Non, il ne faut jamais mentir", "Oui, tout le monde le fait", "Oui, si l’IA le propose"], "a": 0, "e": "Les mensonges sont souvent découverts."}}, {"t": "Mise en forme et envoi", "d": "Un document propre et professionnel", "b": ["Choisissez un modèle simple dans une application de design ou de traitement de texte :"], "l": ["Une <b>police lisible</b> (une seule ou deux).", "Des <b>titres de sections</b> bien visibles.", "Des marges et de l’espace, sans surcharge de couleurs.", "Aucune <b>faute</b> : relisez, puis faites relire.", "Enregistrez en <b>PDF</b> avec un nom clair : Prenom_Nom_CV.pdf."], "b2": ["Envoyez votre CV par e-mail avec un message court et poli : le poste visé, une phrase sur ce que vous apportez, le CV en pièce jointe."], "q": {"q": "Quel format envoyer ?", "o": ["PDF avec un nom clair", "Photo floue", "Un fichier sans nom"], "a": 0, "e": "Un PDF conserve la mise en page."}}, {"t": "Lettre de motivation et entretien", "d": "Se préparer avec l’IA", "b": ["Une bonne lettre est <b>courte</b> (une demi-page) et <b>adaptée</b> à l’entreprise : pourquoi ce poste, ce que vous apportez, un exemple concret, une phrase de conclusion polie.", "L’IA peut aussi vous faire <b>répéter l’entretien</b> : elle pose des questions et commente vos réponses. Entraînez-vous à voix haute.", "Ne partagez pas de données sensibles dans l’outil (numéros de pièces d’identité, mots de passe)."], "b2": ["<b>Mini-projet</b> : créez votre CV d’une page, une lettre adaptée à une vraie offre, et faites un entretien simulé avec l’IA."], "p": "Tu es un recruteur pour le poste de [poste]. Pose-moi une question d’entretien à la fois. Après chacune de mes réponses, donne-moi une note sur 10, ce qui était bien et une amélioration précise. Commence par la première question.", "q": {"q": "Comment utiliser l’IA pour préparer un entretien ?", "o": ["Lui demander de simuler l’entretien", "Lui donner votre pièce d’identité", "Ne rien préparer"], "a": 0, "e": "La simulation permet de s’entraîner."}}];
