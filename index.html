<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IA Creator</title><meta name="theme-color" content="#0B4D1F"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F4F7F3;--fg:#10261A;--mu:#566459;--cd:#FFFFFF;--bd:#DCE5DB;--ac:#0B5A2A;--acf:#FFFFFF;--go:#C9A227;--ok:#1B8A55;--bad:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1710;--fg:#EAF2EA;--mu:#9DB0A0;--cd:#15241B;--bd:#25382B;--ac:#3FBF74;--acf:#06140B;--go:#E3C04F;--ok:#5FD39A;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#0C1710;--fg:#EAF2EA;--mu:#9DB0A0;--cd:#15241B;--bd:#25382B;--ac:#3FBF74;--acf:#06140B;--go:#E3C04F;--ok:#5FD39A;--bad:#FF8A80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 130px}
.hero{background:linear-gradient(135deg,#0B4D1F,#0E7A3B);color:#fff;text-align:center;padding:26px 18px 28px;border-radius:0 0 34px 34px;margin:0 -18px 22px;border-bottom:4px solid #D4AF37}
.hero img{width:96px;height:96px;border-radius:50%;border:3px solid #D4AF37;background:#fff;object-fit:cover}
.hero h1{margin:8px 0 0;font-size:2.1rem}.hero p{margin:4px 0 0;font-size:1.05rem;color:#F1DC8A}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--cd);color:var(--fg);border:0;border-radius:22px;padding:18px 8px;font:inherit;font-weight:700;font-size:1.05rem;box-shadow:0 6px 18px rgba(11,60,30,.12);cursor:pointer;min-height:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile i{font-style:normal;font-size:2.8rem;line-height:1}
h2{font-size:1.5rem;color:var(--ac);margin:4px 0 14px}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.box b{display:block}.mu{color:var(--mu);font-size:.92rem}
.btn{display:block;width:100%;background:var(--ac);color:var(--acf);border:0;border-radius:16px;padding:13px;font:inherit;font-weight:700;cursor:pointer;min-height:48px;margin-top:10px;text-align:center;text-decoration:none}
.btn.alt{background:var(--cd);color:var(--ac);border:2px solid var(--ac)}.btn.wa{background:#1FA855;color:#fff}
label{display:block;font-weight:700;margin-top:10px}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:4px}
.opt{display:block;width:100%;text-align:left;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;font:inherit;cursor:pointer;min-height:44px}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.stat{display:flex;gap:10px}.stat .box{flex:1;text-align:center;margin:0}.stat strong{font-size:1.7rem;color:var(--ac)}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--go)}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:700;background:var(--go);color:#1a1400}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row .btn{width:auto;padding:8px 14px;min-height:44px;margin:0}
.cert{border:6px double var(--go);background:var(--cd);text-align:center;padding:24px 14px;border-radius:12px}
.cert img{width:80px;height:80px;border-radius:50%}.cert h3{font-size:1.5rem;margin:8px 0;color:var(--ac)}.cert .nm{font-size:1.6rem;font-weight:800;margin:12px 0}
footer{text-align:center;color:var(--mu);margin:24px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;min-height:48px;min-width:64px;display:flex;flex-direction:column;align-items:center}
nav i{font-style:normal;font-size:1.5rem;line-height:1.1}pre{white-space:pre-wrap;font:inherit;margin:0}
.lq{display:block;width:100%;text-align:left;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;font:inherit;cursor:pointer;min-height:44px}.lq.ok{border-color:var(--ok)}.lq.bad{border-color:var(--bad)}.pbox{background:var(--cd);border:1px dashed var(--go);border-radius:12px;padding:12px;margin:12px 0}ul{padding-left:20px}li{margin-bottom:6px}
@media print{nav,.np{display:none!important}.wrap{padding:0}}
</style>
</head>

var LS={"0":[{"t": "Comprendre Facebook pour créer du contenu", "d": "Profil, page, groupe : que choisir ?", "b": ["Facebook propose trois espaces principaux. Le <b>profil</b> est personnel : il sert à vos amis et à votre famille. La <b>page</b> est faite pour une marque, un créateur ou une entreprise. Le <b>groupe</b> réunit une communauté autour d’un sujet."], "l": ["<b>Profil</b> : personnel, pour vos proches.", "<b>Page</b> : professionnelle, pour votre activité.", "<b>Groupe</b> : communauté, pour échanger et fidéliser."], "b2": ["Pour développer une activité, la <b>page</b> est le point de départ : elle donne accès aux statistiques et aux publicités, elle donne une image professionnelle et elle sépare votre vie privée de votre travail.", "En général, Facebook met en avant les contenus qui retiennent l’attention : une vidéo regardée jusqu’au bout, un message qui fait réagir ou commenter, un contenu que les gens partagent. Retenez une idée simple : <b>créez du contenu utile, clair et régulier</b>."], "q": {"q": "Quel espace choisir pour promouvoir votre activité ?", "o": ["Un profil personnel", "Une page", "Un groupe privé uniquement"], "a": 1, "e": "La page donne les statistiques et une image professionnelle."}}, {"t": "Créer une page professionnelle", "d": "Nom, logo, description et bouton WhatsApp", "b": ["Une bonne page se reconnaît en quelques secondes. Voici les éléments à soigner :"], "l": ["<b>Nom</b> : court, facile à retenir, sans fautes.", "<b>Photo de profil</b> : votre logo ou votre visage, bien visible même en petit.", "<b>Photo de couverture</b> : une image qui montre ce que vous faites, avec votre slogan.", "<b>Description</b> : qui vous aidez, comment, et comment vous contacter.", "<b>Bouton d’action</b> : ajoutez WhatsApp ou Appeler pour que les clients vous écrivent facilement."], "b2": ["Protégez aussi votre compte : activez la <b>vérification en deux étapes</b> et ne partagez jamais votre mot de passe."], "p": "Tu es un expert en marketing sur Facebook. Rédige 3 descriptions de page Facebook de 2 phrases maximum pour [votre activité], à destination de [votre public]. Ton : [chaleureux / professionnel]. Termine chaque description par un appel à l’action pour me contacter sur WhatsApp.", "q": {"q": "Quel bouton aide les clients à vous contacter facilement ?", "o": ["Un bouton WhatsApp ou Appeler", "Un bouton Partager uniquement", "Aucun bouton"], "a": 0, "e": "Un bouton de contact direct facilite la prise de contact."}}, {"t": "Choisir votre sujet et votre public", "d": "Trouver votre niche et votre promesse", "b": ["Un sujet trop large ne retient personne. Un sujet précis attire les bonnes personnes. Posez-vous trois questions : <b>qui</b> voulez-vous aider, <b>quel problème</b> résolvez-vous, <b>quelle promesse</b> faites-vous ?", "Exemple : « J’aide les petits commerçants à vendre plus grâce à Facebook, en 10 minutes par jour. » Le public, le problème et la promesse sont clairs.", "Regardez aussi ce que font les autres créateurs de votre domaine : quels contenus reçoivent des commentaires ? Inspirez-vous des idées, <b>sans jamais copier</b> les textes ou les images des autres."], "p": "Aide-moi à définir ma niche sur Facebook. Mon domaine : [domaine]. Mes compétences : [compétences]. Propose 5 publics possibles, le problème principal de chacun et une phrase de promesse. Pose-moi 3 questions si tu manques d’informations.", "q": {"q": "Qu’est-ce qui rend un sujet efficace ?", "o": ["Il est très large", "Il est précis, avec un public et une promesse clairs", "Il copie la concurrence"], "a": 1, "e": "La précision attire les bonnes personnes."}}, {"t": "Écrire des publications avec l’IA", "d": "Accroche, valeur et appel à l’action", "b": ["Une bonne publication suit une structure simple :"], "l": ["<b>Accroche</b> : la première ligne doit donner envie de lire.", "<b>Valeur</b> : une astuce, une histoire ou une information utile.", "<b>Appel à l’action</b> : posez une question, invitez à commenter ou à écrire en message."], "b2": ["L’IA vous fait gagner du temps pour les idées et le premier jet. Mais <b>relisez toujours</b> : corrigez les erreurs, ajoutez vos exemples réels et gardez votre façon de parler. Vérifiez les chiffres et les informations avant de publier."], "p": "Tu es community manager. Écris une publication Facebook de 80 à 120 mots sur [sujet] pour [public]. Structure : une accroche forte, 3 conseils concrets, une question pour inciter aux commentaires. Ton : simple et amical. Langue : français. Ajoute 3 hashtags utiles.", "q": {"q": "Que faire après avoir généré un texte avec l’IA ?", "o": ["Le publier tel quel", "Le relire, le corriger et l’adapter", "L’envoyer sans le lire"], "a": 1, "e": "L’IA propose, vous validez."}}, {"t": "Créer des visuels et des vidéos avec l’IA", "d": "Images, affiches et vidéos courtes", "b": ["Les publications avec une image ou une vidéo attirent généralement plus l’attention. Avec l’IA, vous pouvez créer des images, des affiches et des idées de vidéos courtes, même sans être graphiste.", "Pour une bonne image, décrivez : le <b>sujet</b>, le <b>style</b> (réaliste, minimaliste…), les <b>couleurs</b>, l’<b>ambiance</b> et le <b>format</b> (carré ou vertical).", "Attention : les outils d’image écrivent parfois mal le texte. Générez l’image sans texte, puis ajoutez vos mots avec une application de design. N’utilisez jamais le visage d’une personne réelle sans son accord, ni des logos ou personnages protégés par des droits."], "p": "Crée une image pour une publication Facebook : [sujet]. Style : moderne et lumineux. Couleurs : [vos couleurs]. Format vertical 4:5. Sans aucun texte dans l’image. Laisse de l’espace en haut pour ajouter un titre.", "q": {"q": "Comment obtenir un texte lisible sur une image ?", "o": ["Demander à l’IA de l’écrire à chaque fois", "Générer l’image sans texte, puis ajouter le texte soi-même", "Utiliser une image floue"], "a": 1, "e": "Vous contrôlez ainsi l’orthographe et la lisibilité."}}, {"t": "Régularité, calendrier et statistiques", "d": "Planifier 30 jours et mesurer vos résultats", "b": ["La régularité compte plus que la perfection. Une bonne base pour débuter : <b>3 à 5 publications par semaine</b>, à des moments où votre public est en ligne.", "Construisez un calendrier simple : un jour pour un conseil, un jour pour une histoire ou un témoignage, un jour pour une offre, un jour pour une question.", "Consultez ensuite les <b>statistiques</b> de votre page : portée (combien de personnes ont vu), interactions (réactions, commentaires, partages) et abonnés. Gardez ce qui marche, améliorez le reste.", "Respectez les règles de Facebook : pas de fausses promesses, pas d’achat de faux abonnés, pas de contenus copiés. Votre page sera plus durable.", "<b>Mini-projet</b> : préparez et publiez vos 7 premières publications cette semaine."], "p": "Crée un calendrier de contenu Facebook de 30 jours pour [activité], à destination de [public]. Pour chaque jour : le type de publication (texte, image, vidéo courte), le sujet et une idée d’accroche. Alterne conseils, histoires, offres et questions.", "q": {"q": "Que faire avec les statistiques de votre page ?", "o": ["Les ignorer", "Garder les contenus qui marchent et améliorer le reste", "Supprimer la page"], "a": 1, "e": "Les statistiques montrent ce qui plaît à votre public."}}]};
LS["1"]=[{"t": "Comprendre TikTok et son public", "d": "Comment fonctionne le fil « Pour toi »", "b": ["TikTok est une application de <b>vidéos courtes en format vertical</b> (9:16). Sa particularité : le fil <b>« Pour toi »</b> montre des vidéos choisies pour chaque personne, même si elle ne suit pas encore le compte qui les a publiées.", "Cela veut dire qu’un petit compte peut être vu par beaucoup de monde avec une seule bonne vidéo. Ce qui compte, ce n’est pas d’avoir déjà beaucoup d’abonnés, c’est de <b>captiver les gens dès les premières secondes</b>."], "l": ["Les gens regardent-ils la vidéo jusqu’au bout ?", "Réagissent-ils (j’aime, commentaires, partages, enregistrements) ?", "Le sujet correspond-il à ce qu’ils aiment regarder ?"], "b2": ["Retenez la règle de base : <b>une idée par vidéo, claire, courte et utile ou amusante</b>. Les détails changent avec le temps, mais cette logique reste vraie."], "q": {"q": "Qu’est-ce qui aide le plus une vidéo à être montrée à d’autres personnes ?", "o": ["Avoir déjà des milliers d’abonnés", "Que les gens la regardent longtemps et réagissent", "Publier à minuit uniquement"], "a": 1, "e": "Le temps de visionnage et les réactions comptent beaucoup."}}, {"t": "Créer et optimiser votre compte", "d": "Pseudo, photo, bio et contact", "b": ["Votre profil est votre vitrine : en quelques secondes, un visiteur doit comprendre <b>qui vous êtes et ce que vous apportez</b>."], "l": ["<b>Pseudo</b> : court, facile à retenir et à écrire.", "<b>Photo</b> : votre visage ou votre logo, bien lisible en petit.", "<b>Bio</b> : courte (environ 80 caractères), avec votre promesse et un appel à l’action.", "<b>Contact</b> : ajoutez un moyen de vous joindre (lien ou WhatsApp) selon les options disponibles pour votre compte."], "b2": ["Si vous vendez ou promouvez une activité, pensez à un <b>compte professionnel</b> : il donne accès à des statistiques, mais il limite en général les musiques à celles autorisées pour un usage commercial.", "Protégez votre compte : activez la <b>vérification en deux étapes</b> et ne partagez jamais votre mot de passe."], "p": "Tu es un expert TikTok. Écris 5 idées de bio TikTok de 80 caractères maximum pour [votre activité], à destination de [votre public]. Chaque bio doit contenir une promesse claire et un appel à l’action. Ton : [simple et motivant]. Ajoute 1 emoji maximum par bio.", "q": {"q": "Que doit montrer votre bio en priorité ?", "o": ["Votre date de naissance", "Qui vous aidez et ce que vous apportez", "Une longue histoire de votre vie"], "a": 1, "e": "Une bio claire donne envie de s’abonner."}}, {"t": "Trouver vos idées de vidéos", "d": "Piliers de contenu et tendances", "b": ["Pour ne jamais manquer d’idées, choisissez 3 ou 4 <b>piliers de contenu</b>, c’est-à-dire des types de vidéos que vous répétez :"], "l": ["<b>Éduquer</b> : une astuce, une explication, une erreur à éviter.", "<b>Raconter</b> : votre histoire, les coulisses, un client ou un élève.", "<b>Prouver</b> : un avant/après, un résultat, une démonstration.", "<b>Divertir</b> : un format léger lié à votre sujet."], "b2": ["Surveillez les <b>tendances</b> (sons, formats, défis) mais adaptez-les à votre sujet au lieu de les copier. Lisez aussi les commentaires : les questions des gens sont une mine d’idées.", "Ne copiez jamais la vidéo d’un autre créateur. Inspirez-vous du format, puis apportez votre propre contenu."], "p": "Tu es un stratège de contenu TikTok. Mon domaine : [domaine]. Mon public : [public]. Propose 30 idées de vidéos réparties en 4 piliers (éduquer, raconter, prouver, divertir). Pour chaque idée, donne un titre et une accroche de moins de 10 mots.", "q": {"q": "Comment utiliser une tendance intelligemment ?", "o": ["Copier exactement la vidéo d’un autre", "L’adapter à votre sujet avec votre propre contenu", "L’ignorer toujours"], "a": 1, "e": "Adapter une tendance, c’est rester original."}}, {"t": "Écrire un script qui retient l’attention", "d": "Accroche, contenu et appel à l’action en 30 secondes", "b": ["Une vidéo qui marche suit presque toujours la même structure :"], "l": ["<b>Accroche (0 à 3 secondes)</b> : une phrase choc, une question ou une promesse.", "<b>Contenu (3 à 25 secondes)</b> : 2 ou 3 points clairs, rythme rapide.", "<b>Appel à l’action (fin)</b> : invitez à commenter, enregistrer ou suivre le compte."], "b2": ["Écrivez comme vous <b>parlez</b> : phrases courtes, mots simples. Ajoutez du <b>texte à l’écran</b> et des <b>sous-titres</b>, car beaucoup de gens regardent sans le son.", "L’IA peut écrire le premier script en quelques secondes. Relisez-le à voix haute : s’il est difficile à dire, simplifiez-le."], "p": "Tu es un scénariste de vidéos TikTok. Écris un script de 30 secondes sur [sujet] pour [public]. Structure : une accroche de 3 secondes, 3 points courts, un appel à l’action. Langue : français parlé et simple. Indique aussi le texte à afficher à l’écran pour chaque partie.", "q": {"q": "À quel moment faut-il captiver le spectateur ?", "o": ["À la fin de la vidéo", "Dans les premières secondes", "Après 20 secondes"], "a": 1, "e": "Sans bonne accroche, les gens passent à la vidéo suivante."}}, {"t": "Filmer, monter et utiliser l’IA", "d": "Lumière, son, sous-titres et outils IA", "b": ["Vous n’avez pas besoin de matériel coûteux : votre téléphone suffit si vous soignez <b>la lumière, le son et le cadrage</b>."], "l": ["<b>Lumière</b> : placez-vous face à une fenêtre ou en plein jour.", "<b>Son</b> : choisissez un endroit calme, parlez près du téléphone.", "<b>Cadrage</b> : filmez en vertical, votre visage et vos mains bien visibles.", "<b>Montage</b> : coupez les silences, gardez des plans courts, ajoutez des sous-titres (applications comme CapCut)."], "b2": ["L’IA peut vous aider à créer des images, des voix off et des courtes séquences vidéo. Mais respectez les règles : <b>n’utilisez jamais le visage ou la voix d’une vraie personne sans son accord</b>, et ne diffusez pas de faux contenus qui peuvent tromper.", "TikTok demande d’indiquer quand un contenu réaliste est créé ou modifié par l’IA : utilisez l’option d’étiquetage prévue lors de la publication, et vérifiez les règles actuelles dans l’application. Pour la musique, choisissez des sons autorisés pour votre type de compte."], "p": "Crée une courte séquence vidéo verticale (format 9:16) de 5 secondes : [décrivez la scène]. Style : réaliste et lumineux. Mouvement de caméra : lent travelling avant. Sans texte dans l’image et sans visage d’une personne réelle.", "q": {"q": "Que faire pour un contenu réaliste créé avec l’IA ?", "o": ["Le cacher", "Utiliser l’étiquette prévue par TikTok pour l’indiquer", "Utiliser le visage d’une célébrité"], "a": 1, "e": "La transparence protège votre compte et votre public."}}, {"t": "Publier, analyser et progresser", "d": "Régularité, statistiques et plan sur 30 jours", "b": ["La régularité compte plus que la perfection. Pour débuter, visez <b>3 à 5 vidéos par semaine</b>, ou une par jour si vous le pouvez. Publiez quand votre public est actif et testez plusieurs horaires.", "Dans la légende, utilisez <b>des mots-clés liés à votre sujet</b> et quelques hashtags utiles. Répondez aux commentaires : cela encourage la discussion.", "Consultez vos <b>statistiques</b> : vues, durée moyenne de visionnage, partages, nouveaux abonnés. Regardez surtout <b>à quel moment les gens quittent la vidéo</b> et améliorez cette partie.", "Respectez les règles de la communauté : pas d’achat de faux abonnés ou de fausses vues, pas de promesses trompeuses. Votre compte sera plus durable.", "<b>Mini-projet</b> : publiez 10 vidéos en 14 jours, puis analysez les 2 meilleures et les 2 moins bonnes."], "p": "Voici les statistiques de mes 10 dernières vidéos TikTok : [collez ici les vues, la durée moyenne de visionnage et les partages]. Analyse-les, dis-moi ce qui marche et ce qui ne marche pas, puis propose un plan de 30 jours avec 3 améliorations prioritaires.", "q": {"q": "Que faire avec les statistiques de vos vidéos ?", "o": ["Les ignorer", "Repérer ce qui marche et améliorer le reste", "Supprimer le compte"], "a": 1, "e": "Les statistiques indiquent ce qui plaît à votre public."}}];
LS["2"]=[{"t": "Comprendre YouTube", "d": "Vidéos longues, Shorts et recommandations", "b": ["YouTube est à la fois un <b>moteur de recherche</b> (les gens tapent une question) et une <b>plateforme de recommandations</b> (la page d’accueil et les vidéos suggérées). Une bonne vidéo peut donc être trouvée longtemps après sa publication."], "l": ["<b>Vidéos longues</b> : idéales pour expliquer, enseigner et gagner la confiance.", "<b>Shorts</b> : vidéos verticales très courtes, utiles pour se faire connaître.", "<b>Chaîne</b> : votre bibliothèque de vidéos, qui travaille pour vous dans la durée."], "b2": ["Deux choses décident du succès d’une vidéo : les gens <b>cliquent-ils</b> (titre et miniature) et <b>restent-ils</b> (qualité du début et du contenu). Toute la formation tourne autour de ces deux idées."], "q": {"q": "Quels sont les deux éléments clés pour réussir une vidéo ?", "o": ["Le nombre de hashtags et la durée", "Le clic (titre et miniature) et la rétention", "La couleur du logo"], "a": 1, "e": "On doit donner envie de cliquer, puis de rester."}}, {"t": "Créer et optimiser votre chaîne", "d": "Nom, logo, bannière et description", "b": ["Votre chaîne doit être comprise en quelques secondes. Soignez ces éléments :"], "l": ["<b>Nom</b> : simple, facile à retenir et à écrire.", "<b>Logo</b> : lisible en très petit, avec peu de détails.", "<b>Bannière</b> : dites ce que vous proposez et à quel rythme vous publiez.", "<b>Description</b> : qui vous aidez, quels sujets, et comment vous contacter.", "<b>Contact</b> : ajoutez votre adresse e-mail professionnelle ou vos liens."], "b2": ["Protégez votre compte avec la <b>vérification en deux étapes</b>, car perdre une chaîne est très difficile à rattraper."], "p": "Tu es un expert YouTube. Écris 3 descriptions de chaîne YouTube de 100 à 150 mots pour [votre domaine], à destination de [votre public]. Chaque description doit contenir : la promesse de la chaîne, les sujets traités, la fréquence de publication et un appel à s’abonner. Ton : [simple et chaleureux].", "q": {"q": "Que doit permettre votre description de chaîne ?", "o": ["Comprendre qui vous aidez et ce que vous proposez", "Raconter toute votre vie", "Rester vide"], "a": 0, "e": "Une description claire aide à convaincre les visiteurs de s’abonner."}}, {"t": "Choisir votre sujet et vos idées de vidéos", "d": "Niche, mots-clés et formats qui marchent", "b": ["Choisissez un sujet précis et un public précis. Pour trouver des idées, utilisez la <b>barre de recherche de YouTube</b> : les suggestions qui apparaissent quand vous tapez un début de phrase sont les recherches réelles des gens.", "Voici trois formats simples qui fonctionnent bien :"], "l": ["<b>Répondre à une question</b> : « Comment faire… ? »", "<b>Tutoriel pas à pas</b> : montrer une méthode du début à la fin.", "<b>Liste</b> : « 5 erreurs à éviter… », « 7 outils pour… »"], "b2": ["Regardez ce que font les autres chaînes de votre domaine : quelles vidéos reçoivent beaucoup de vues et de commentaires ? Inspirez-vous des idées, <b>sans copier</b> leurs contenus."], "p": "Tu es un stratège YouTube. Mon domaine : [domaine]. Mon public : [public]. Propose 30 idées de vidéos réparties en 3 formats (réponse à une question, tutoriel, liste). Pour chaque idée, donne un titre accrocheur et le problème résolu pour le spectateur.", "q": {"q": "Où trouver de vraies idées de recherche des gens ?", "o": ["Dans les suggestions de la barre de recherche YouTube", "Dans un dictionnaire", "Au hasard"], "a": 0, "e": "Les suggestions reflètent ce que les gens cherchent vraiment."}}, {"t": "Titres, miniatures et descriptions", "d": "Donner envie de cliquer, sans tromper", "b": ["Le <b>titre</b> doit être clair, contenir un mot-clé important et annoncer un bénéfice. Gardez-le assez court pour rester lisible sur téléphone.", "La <b>miniature</b> est l’image qui donne envie de cliquer. Quelques règles simples :"], "l": ["Un visage expressif ou un élément très visible.", "3 à 4 mots maximum, en grosses lettres.", "Des couleurs contrastées, lisibles même en petit.", "Une image qui correspond vraiment au contenu de la vidéo."], "b2": ["Dans la <b>description</b>, les 2 premières lignes sont les plus importantes : résumez la vidéo avec vos mots-clés. Ajoutez ensuite des chapitres et vos liens.", "Ne faites jamais de titre ou de miniature <b>trompeurs</b> : les spectateurs quittent la vidéo, ce qui nuit à votre chaîne."], "p": "Tu es un expert en titres YouTube. Pour une vidéo sur [sujet], destinée à [public], propose 10 titres clairs de moins de 60 caractères, dont le mot-clé principal est [mot-clé]. Ajoute ensuite une description de 100 mots avec un résumé, 5 mots-clés naturels et un appel à s’abonner.", "q": {"q": "Que faut-il éviter pour une miniature ?", "o": ["Un texte court et lisible", "Une image qui ne correspond pas à la vidéo", "Des couleurs contrastées"], "a": 1, "e": "Une miniature trompeuse fait fuir les spectateurs."}}, {"t": "Script, tournage et montage avec l’IA", "d": "Structurer sa vidéo et gagner du temps", "b": ["Un bon script suit une structure simple :"], "l": ["<b>Accroche</b> : les 10 premières secondes donnent la promesse de la vidéo.", "<b>Contenu</b> : 3 à 5 points clairs, avec des exemples.", "<b>Conclusion et appel à l’action</b> : résumez et invitez à s’abonner ou à voir une autre vidéo."], "b2": ["Pour le tournage, le <b>son</b> est plus important que l’image : parlez dans un endroit calme, près du micro. Filmez face à la lumière du jour. Au montage, coupez les silences, ajoutez des sous-titres et des images pour illustrer vos propos.", "L’IA peut écrire le premier script, proposer des plans et aider à la voix off. Respectez les règles : indiquez quand un contenu réaliste est modifié ou généré par l’IA, en suivant les options de YouTube lors de la publication. Utilisez des musiques dont vous avez le droit, par exemple celles de la bibliothèque audio de YouTube, et ne copiez jamais les contenus des autres."], "p": "Tu es scénariste YouTube. Écris le script d’une vidéo de 5 minutes sur [sujet] pour [public]. Structure : une accroche de 10 secondes, 4 parties avec un exemple chacune, une conclusion avec appel à l’action. Langue : français parlé et simple. Indique aussi les images à montrer pour chaque partie.", "q": {"q": "Que faire pour la musique d’une vidéo ?", "o": ["Prendre n’importe quelle chanson", "Utiliser une musique dont vous avez le droit", "Ne jamais mettre de son"], "a": 1, "e": "Une musique sans autorisation peut bloquer ou supprimer la vidéo."}}, {"t": "Publier, analyser et progresser", "d": "Régularité, statistiques et plan sur 30 jours", "b": ["Mieux vaut une vidéo utile toutes les semaines que dix vidéos puis un long silence. Pour débuter, <b>1 à 2 vidéos par semaine</b> est un bon rythme.", "Dans <b>YouTube Studio</b>, regardez surtout :"], "l": ["<b>Taux de clics</b> : les gens cliquent-ils sur votre miniature ? S’il est faible, changez le titre ou la miniature.", "<b>Durée moyenne de visionnage</b> : les gens restent-ils ? S’ils partent vite, améliorez le début.", "<b>Rétention</b> : repérez le moment précis où les spectateurs quittent la vidéo."], "b2": ["Créez des <b>playlists</b> pour enchaîner vos vidéos, répondez aux commentaires et gardez ce qui marche.", "Respectez les règles de YouTube : pas de faux abonnés ou de fausses vues, pas de contenus copiés. La monétisation fait l’objet d’une formation séparée.", "<b>Mini-projet</b> : publiez 4 vidéos en 4 semaines, puis comparez leurs statistiques."], "p": "Voici les statistiques de mes 4 dernières vidéos YouTube : [collez le taux de clics, la durée moyenne de visionnage et les vues]. Analyse-les, dis-moi ce qui marche et ce qui ne marche pas, puis propose 3 améliorations pour les 30 prochains jours.", "q": {"q": "Que faire si le taux de clics est faible ?", "o": ["Changer le titre ou la miniature", "Supprimer la chaîne", "Ne rien changer"], "a": 0, "e": "Le titre et la miniature sont ce qui donne envie de cliquer."}}];
