<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IA Creator</title><meta name="theme-color" content="#0B4D1F"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F4F7F3;--fg:#10261A;--mu:#566459;--cd:#FFFFFF;--bd:#DCE5DB;--ac:#0B5A2A;--acf:#FFFFFF;--go:#C9A227;--ok:#1B8A55;--bad:#C0392B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1710;--fg:#EAF2EA;--mu:#9DB0A0;--cd:#15241B;--bd:#25382B;--ac:#3FBF74;--acf:#06140B;--go:#E3C04F;--ok:#5FD39A;--bad:#FF8A80}}
:root[data-theme="dark"]{--bg:#0C1710;--fg:#EAF2EA;--mu:#9DB0A0;--cd:#15241B;--bd:#25382B;--ac:#3FBF74;--acf:#06140B;--go:#E3C04F;--ok:#5FD39A;--bad:#FF8A80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 130px}
.hero{background:linear-gradient(135deg,#0B4D1F,#0E7A3B);color:#fff;text-align:center;padding:26px 18px 28px;border-radius:0 0 34px 34px;margin:0 -18px 22px;border-bottom:4px solid #D4AF37}
.hero img{width:96px;height:96px;border-radius:50%;border:3px solid #D4AF37;background:#fff;object-fit:cover}
.hero h1{margin:8px 0 0;font-size:2.1rem}.hero p{margin:4px 0 0;font-size:1.05rem;color:#F1DC8A}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--cd);color:var(--fg);border:0;border-radius:22px;padding:18px 8px;font:inherit;font-weight:700;font-size:1.05rem;box-shadow:0 6px 18px rgba(11,60,30,.12);cursor:pointer;min-height:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile i{font-style:normal;font-size:2.8rem;line-height:1}
h2{font-size:1.5rem;color:var(--ac);margin:4px 0 14px}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.box b{display:block}.mu{color:var(--mu);font-size:.92rem}
.btn{display:block;width:100%;background:var(--ac);color:var(--acf);border:0;border-radius:16px;padding:13px;font:inherit;font-weight:700;cursor:pointer;min-height:48px;margin-top:10px;text-align:center;text-decoration:none}
.btn.alt{background:var(--cd);color:var(--ac);border:2px solid var(--ac)}.btn.wa{background:#1FA855;color:#fff}
label{display:block;font-weight:700;margin-top:10px}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:4px}
.opt{display:block;width:100%;text-align:left;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;font:inherit;cursor:pointer;min-height:44px}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--bad)}
.stat{display:flex;gap:10px}.stat .box{flex:1;text-align:center;margin:0}.stat strong{font-size:1.7rem;color:var(--ac)}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--go)}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.78rem;font-weight:700;background:var(--go);color:#1a1400}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row .btn{width:auto;padding:8px 14px;min-height:44px;margin:0}
.cert{border:6px double var(--go);background:var(--cd);text-align:center;padding:24px 14px;border-radius:12px}
.cert img{width:80px;height:80px;border-radius:50%}.cert h3{font-size:1.5rem;margin:8px 0;color:var(--ac)}.cert .nm{font-size:1.6rem;font-weight:800;margin:12px 0}
footer{text-align:center;color:var(--mu);margin:24px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;color:var(--ac);font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;min-height:48px;min-width:64px;display:flex;flex-direction:column;align-items:center}
nav i{font-style:normal;font-size:1.5rem;line-height:1.1}pre{white-space:pre-wrap;font:inherit;margin:0}
.lq{display:block;width:100%;text-align:left;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;font:inherit;cursor:pointer;min-height:44px}.lq.ok{border-color:var(--ok)}.lq.bad{border-color:var(--bad)}.pbox{background:var(--cd);border:1px dashed var(--go);border-radius:12px;padding:12px;margin:12px 0}ul{padding-left:20px}li{margin-bottom:6px}
@media print{nav,.np{display:none!important}.wrap{padding:0}}
</style>
</head>
