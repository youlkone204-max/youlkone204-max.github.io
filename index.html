LS["19"]=[{"t": "Le rôle d’une carte de visite", "d": "Donner envie de vous recontacter", "b": ["Une carte de visite est un petit support qui permet à quelqu’un de <b>vous retrouver</b> après une rencontre. Elle doit être simple, lisible et facile à utiliser."], "l": ["<b>Nom</b> et <b>activité</b> en gros.", "<b>Téléphone ou WhatsApp</b>.", "<b>E-mail</b> et lien de votre page ou site.", "<b>Logo</b> et un slogan court si possible.", "Un <b>QR code</b> utile (facultatif)."], "b2": ["Trop d’informations rendent la carte illisible. Gardez l’essentiel."], "q": {"q": "Que doit permettre une carte de visite ?", "o": ["Vous recontacter facilement", "Raconter votre vie", "Remplacer votre site"], "a": 0, "e": "Elle sert à vous retrouver après une rencontre."}}, {"t": "Définir le contenu et le message", "d": "Quoi mettre, quoi laisser", "b": ["Pour chaque information, demandez-vous : <b>est-elle utile pour qu’on me contacte ou me choisisse ?</b> Si non, retirez-la.", "Un <b>slogan</b> de quelques mots peut résumer votre promesse. Évitez les phrases longues."], "p": "Tu es un expert en branding. Propose 8 slogans de moins de 6 mots pour une activité de [activité] destinée à [public]. Ton : [professionnel et chaleureux]. Donne ensuite le texte final idéal pour une carte de visite : nom, titre, téléphone, WhatsApp, e-mail, lien.", "q": {"q": "Comment décider quoi mettre sur la carte ?", "o": ["Garder ce qui aide à vous contacter ou à vous choisir", "Tout mettre", "Ne rien mettre"], "a": 0, "e": "L’essentiel suffit."}}, {"t": "Le design de la carte", "d": "Recto, verso, couleurs et lisibilité", "b": ["Utilisez une application de design et un modèle simple. Le format courant est d’environ <b>85 × 55 mm</b> : vérifiez-le avec votre imprimeur."], "l": ["Respectez vos <b>couleurs de marque</b> (2 ou 3 maximum).", "Texte de <b>taille lisible</b> : pas trop petit.", "Le <b>nom et le métier</b> d’abord, puis les contacts.", "Utilisez le <b>verso</b> pour le logo ou le QR code.", "Laissez des marges et demandez le <b>fond perdu</b> à l’imprimeur."], "b2": ["Imprimez un exemplaire à la maison ou chez un imprimeur pour voir si tout se lit sans effort."], "q": {"q": "Que mettre en premier sur la carte ?", "o": ["Le nom et le métier", "Une liste de 20 services", "Des paragraphes"], "a": 0, "e": "On doit comprendre qui vous êtes en une seconde."}}, {"t": "QR code et carte numérique", "d": "Un lien pratique vers WhatsApp ou votre page", "b": ["Un <b>QR code</b> permet d’ouvrir en un geste votre page, votre catalogue ou une conversation WhatsApp. Vous pouvez le créer avec un générateur gratuit à partir d’un lien.", "<b>Testez toujours le QR code</b> avec votre téléphone avant d’imprimer. Il doit être assez grand et bien contrasté.", "Vous pouvez aussi garder une <b>carte numérique</b> (image ou page) à envoyer par WhatsApp."], "b2": ["Pour un lien WhatsApp direct, utilisez l’adresse wa.me suivie de votre numéro avec l’indicatif du pays, sans le zéro initial ni les espaces."], "p": "Aide-moi à préparer le lien WhatsApp et le message prérempli pour mon QR code. Mon activité : [activité]. Numéro : [numéro avec indicatif]. Donne le format du lien wa.me avec un message court et poli encodé correctement.", "q": {"q": "Que faire avant d’imprimer un QR code ?", "o": ["Le tester avec un téléphone", "L’imprimer sans le tester", "Le rendre très petit"], "a": 0, "e": "Un QR code qui ne marche pas fait perdre des clients."}}, {"t": "Impression et distribution", "d": "Commander et utiliser vos cartes", "b": ["Demandez un <b>devis</b> à un ou deux imprimeurs et précisez le format, le papier et la quantité. Commencez par une <b>petite quantité</b> pour vérifier le résultat avant d’en faire beaucoup.", "Relisez le <b>numéro de téléphone</b> et l’orthographe trois fois : une erreur sur toutes les cartes coûte cher.", "Donnez votre carte avec une phrase (« Voici ma carte, n’hésitez pas à m’écrire sur WhatsApp ») et <b>enregistrez les contacts</b> que vous rencontrez pour les relancer."], "b2": ["<b>Mini-projet</b> : créez le recto et le verso, testez le QR code, demandez un devis et commandez une petite quantité."], "q": {"q": "Pourquoi commencer par une petite quantité ?", "o": ["Pour vérifier le résultat avant d’en imprimer beaucoup", "Pour gaspiller du papier", "Pour ne rien tester"], "a": 0, "e": "Une erreur est moins coûteuse sur peu d’exemplaires."}}];
LS["6"]=[{"t": "Les bases d’une vidéo publicitaire", "d": "Un objectif, un public, une offre", "b": ["Une vidéo publicitaire a un seul but : pousser le spectateur à <b>faire une action précise</b> (écrire sur WhatsApp, visiter votre page, acheter). Avant de créer, répondez à trois questions : <b>qui</b> regarde, <b>quelle offre</b> vous proposez, <b>quelle action</b> vous attendez."], "l": ["Durée courte : <b>15 à 30 secondes</b> suffisent souvent.", "Format <b>vertical</b> pour téléphone.", "Structure : problème, solution, preuve, appel à l’action."], "b2": ["Une publicité honnête gagne la confiance. Ne promettez que ce que vous pouvez tenir."], "q": {"q": "Quel est le but d’une vidéo publicitaire ?", "o": ["Pousser le spectateur à faire une action précise", "Montrer toute votre vie", "Durer le plus longtemps possible"], "a": 0, "e": "Chaque publicité a une action claire à obtenir."}}, {"t": "Écrire le script publicitaire", "d": "Accroche, problème, solution, preuve et appel à l’action", "b": ["Voici une structure simple pour 20 secondes :"], "l": ["<b>Accroche (0 à 3 s)</b> : une question ou une phrase qui arrête le défilement.", "<b>Problème</b> : ce qui gêne votre client.", "<b>Solution</b> : votre produit ou service.", "<b>Preuve</b> : un résultat réel, une démonstration.", "<b>Appel à l’action</b> : « Écrivez-nous sur WhatsApp »."], "b2": ["Écrivez comme on parle, en phrases courtes. Relisez à voix haute."], "p": "Tu es un expert en publicité courte. Écris un script de 20 secondes pour [produit ou service], destiné à [public]. Prix réel : [prix]. Structure : accroche de 3 secondes, problème, solution, preuve réelle, appel à l’action WhatsApp. Indique la voix off et le texte à l’écran pour chaque partie. N’invente aucun résultat.", "q": {"q": "Où placer l’accroche ?", "o": ["Dans les premières secondes", "À la fin", "Nulle part"], "a": 0, "e": "Sans accroche, on passe à la vidéo suivante."}}, {"t": "Créer les scènes et les visuels", "d": "Vrais plans et ambiances IA", "b": ["Mélangez de <b>vraies images de votre produit</b> et des <b>ambiances créées par l’IA</b> (décor, fond, mise en scène). Le client doit toujours voir le <b>vrai produit</b>.", "Un clip, une idée : filmez ou générez des plans courts de 3 à 5 secondes, avec un seul mouvement par plan."], "p": "Un clip vertical de 5 secondes pour une publicité : [décor et ambiance] mettant en valeur [type de produit]. Style : lumineux et moderne. Couleurs : [vos couleurs]. Espace vide au centre pour le vrai produit. Sans texte, sans logo, sans visage d’une personne réelle.", "q": {"q": "Que doit voir le client dans la publicité ?", "o": ["Le vrai produit", "Un produit différent", "Aucun produit"], "a": 0, "e": "On ne trompe pas le client sur ce qu’il va recevoir."}}, {"t": "Voix, musique, sous-titres et rythme", "d": "Garder l’attention jusqu’au bout", "b": ["Une publicité qui retient l’attention change d’image <b>toutes les 2 à 3 secondes</b>. Ajoutez :"], "l": ["Une <b>voix off claire</b> (la vôtre ou une voix IA naturelle).", "Une <b>musique autorisée</b> à volume bas sous la voix.", "Des <b>sous-titres relus</b> : beaucoup regardent sans le son.", "Du <b>texte à l’écran</b> pour les mots clés et le prix.", "Votre <b>logo</b> et le contact à la fin."], "b2": ["Regardez la vidéo sur votre téléphone, avec puis sans le son, avant de la publier."], "p": "Réécris cette voix off publicitaire pour qu’elle soit naturelle à l’oral, en 20 secondes maximum, avec des phrases courtes et un appel à l’action final : [collez votre texte].", "q": {"q": "Pourquoi ajouter des sous-titres ?", "o": ["Beaucoup regardent sans le son", "Pour allonger la vidéo", "Ce n’est jamais utile"], "a": 0, "e": "Les sous-titres aident à comprendre sans le son."}}, {"t": "Règles, honnêteté et droits", "d": "Publier sans problème", "b": ["Les plateformes peuvent refuser ou supprimer une publicité qui ne respecte pas leurs règles :"], "l": ["Pas de <b>fausses promesses</b> ni de résultats garantis.", "Pas de <b>faux témoignages</b> ni d’avant/après truqués.", "Indiquez quand un contenu réaliste est <b>créé par l’IA</b>, selon les options de la plateforme.", "Pas de <b>musique, personnages ou logos</b> sans autorisation.", "Affichez le <b>prix et les conditions</b> clairement."], "b2": ["Lisez les règles publicitaires de chaque plateforme : elles changent, et chacune a ses interdits."], "q": {"q": "Peut-on utiliser un faux témoignage ?", "o": ["Non, c’est trompeur", "Oui, si l’IA l’écrit", "Oui, une seule fois"], "a": 0, "e": "Les faux témoignages sont malhonnêtes et risqués."}}, {"t": "Tester, mesurer et améliorer", "d": "Garder la version gagnante", "b": ["Créez <b>deux versions</b> de la vidéo qui ne changent que l’accroche. Diffusez-les avec un petit budget ou en organique, puis comparez : vues, clics, messages reçus et coût par résultat.", "Gardez la meilleure, changez un seul élément, et recommencez."], "b2": ["<b>Mini-projet</b> : créez 2 vidéos de 20 secondes pour la même offre, avec deux accroches différentes, et notez laquelle génère le plus de messages."], "p": "Voici les résultats de mes deux publicités vidéo : version A [vues, clics, messages], version B [vues, clics, messages]. Analyse-les, dis-moi laquelle est la meilleure et pourquoi, puis propose 3 changements à tester.", "q": {"q": "Comment améliorer une publicité ?", "o": ["Tester deux versions et garder la meilleure", "Changer tout à chaque fois", "Ne jamais mesurer"], "a": 0, "e": "On compare, on garde ce qui marche."}}];
LS["13"]=[{"t": "Comprendre les avatars IA", "d": "Portraits, mascottes et présentateurs virtuels", "b": ["Un avatar IA est un personnage numérique créé à l’aide de l’intelligence artificielle. Il peut être un <b>portrait stylisé</b>, une <b>mascotte</b> pour votre marque ou un <b>présentateur virtuel</b> qui parle dans des vidéos."], "l": ["<b>Utile pour</b> : photo de profil, personnage de marque, vidéos explicatives, tutoriels.", "<b>Limites</b> : expressions parfois artificielles, détails à vérifier, public qui peut se méfier si on lui cache que c’est une IA."], "b2": ["Un avatar fonctionne mieux quand il a une <b>vraie fonction</b> : présenter, expliquer, accompagner votre marque."], "q": {"q": "À quoi sert surtout un avatar de marque ?", "o": ["À présenter et accompagner votre marque", "À imiter quelqu’un", "À cacher la vérité"], "a": 0, "e": "Il doit avoir un rôle clair."}}, {"t": "Créer l’identité de votre avatar", "d": "Rôle, personnalité et style", "b": ["Décidez d’abord s’il représente <b>vous</b> (style illustré) ou une <b>mascotte</b>. Définissez son rôle, sa personnalité (sympathique, sérieux, drôle), son style visuel et ses couleurs, en accord avec votre marque."], "p": "Aide-moi à créer la fiche d’un personnage de marque. Activité : [activité]. Public : [public]. Propose 3 personnages avec : un nom, une personnalité en 3 mots, un style visuel (dessin, 3D, minimaliste), les couleurs de ses vêtements et une phrase typique.", "q": {"q": "Qu’est-ce qui guide le choix du style ?", "o": ["L’image de votre marque et votre public", "Le hasard", "La couleur du téléphone"], "a": 0, "e": "L’avatar doit refléter votre marque."}}, {"t": "Générer et garder un personnage cohérent", "d": "Même visage, mêmes couleurs", "b": ["Pour que votre avatar soit reconnaissable, <b>réutilisez toujours la même description</b> dans vos prompts : âge apparent, cheveux, vêtements, couleurs, style de dessin. Notez-la dans une <b>fiche personnage</b>.", "Générez plusieurs poses et expressions sur un <b>fond uni</b>, vérifiez les mains et les détails, puis gardez les meilleurs résultats."], "p": "Personnage de marque : [description fixe : âge apparent, coiffure, vêtements, couleurs], style [illustration moderne], expression [souriante], pose [bras croisés], fond uni clair, vue de face, sans texte, sans logo, ne ressemble à aucune personne réelle.", "q": {"q": "Comment garder le même personnage ?", "o": ["Réutiliser la même description dans chaque prompt", "Changer la description à chaque fois", "Utiliser des images au hasard"], "a": 0, "e": "Une description fixe donne des résultats proches."}}, {"t": "Faire parler votre avatar", "d": "Script, voix et sous-titres", "b": ["Un avatar parlant peut présenter une formation, une offre ou une astuce. Préparez un <b>script court</b> (30 à 60 secondes), choisissez une <b>voix claire</b> au rythme naturel et ajoutez des <b>sous-titres</b>.", "Soyez transparent : dites clairement que c’est un <b>présentateur virtuel</b>. Cela construit la confiance."], "p": "Tu es un scénariste de vidéos pédagogiques. Écris le script d’une vidéo de 45 secondes présentée par un avatar virtuel qui explique [sujet] à [public]. Phrases courtes, ton [chaleureux]. Ajoute le texte à afficher et une phrase finale qui indique qu’il s’agit d’un présentateur virtuel.", "q": {"q": "Faut-il cacher que l’avatar est une IA ?", "o": ["Non, il vaut mieux être transparent", "Oui, toujours", "Cela n’a aucun effet"], "a": 0, "e": "La transparence protège la confiance."}}, {"t": "Consentement, éthique et sécurité", "d": "Utiliser les avatars sans nuire", "b": ["Les avatars posent des questions importantes :"], "l": ["<b>Jamais d’avatar d’une personne réelle</b> (visage ou voix) sans son accord clair.", "<b>Pas de tromperie</b> : pas de faux témoignages ni de fausses personnes qui recommandent un produit.", "<b>Vos photos</b> : lisez la politique de confidentialité de l’outil avant d’y envoyer votre visage. N’envoyez jamais de photos d’enfants ou de proches sans leur accord.", "<b>Licence</b> : vérifiez si vous pouvez utiliser l’avatar pour vendre."], "b2": ["<b>Mini-projet</b> : créez la fiche de votre personnage, générez 5 images cohérentes et un court script de présentation."], "q": {"q": "Peut-on créer l’avatar d’une personne réelle sans son accord ?", "o": ["Non", "Oui si elle est célèbre", "Oui si c’est une blague"], "a": 0, "e": "Utiliser l’image ou la voix d’autrui sans accord est interdit ou risqué."}}];
LS["14"]=[{"t": "Comprendre la musique IA", "d": "Créer une musique à partir d’un texte", "b": ["Les outils de musique IA créent une musique à partir d’une description : genre, ambiance, instruments. Vous guidez l’outil comme un réalisateur."], "l": ["<b>Utile pour</b> : musiques de fond pour vos vidéos, jingles, introductions, ambiances.", "<b>Limites</b> : qualité variable, voix parfois artificielles, résultats à trier."], "b2": ["Écoutez toujours plusieurs essais et gardez le meilleur. Un bon résultat demande souvent 3 à 5 générations."], "q": {"q": "Comment obtenir une bonne musique ?", "o": ["Décrire précisément et comparer plusieurs essais", "Générer une seule fois sans écouter", "Copier une chanson connue"], "a": 0, "e": "La précision et le tri améliorent le résultat."}}, {"t": "Écrire des prompts musicaux", "d": "Genre, ambiance, tempo et instruments", "b": ["Un bon prompt musical décrit :"], "l": ["Le <b>genre</b> (afro pop, gospel, électro, acoustique…).", "L’<b>ambiance</b> (joyeuse, calme, motivante).", "Le <b>tempo</b> (lent, moyen, rapide, ou un nombre de battements par minute).", "Les <b>instruments</b> (guitare, percussions, piano, synthés).", "La <b>durée</b> et l’<b>usage</b> (fond de vidéo, jingle).", "Avec ou sans <b>voix</b> : pour un fond de vidéo, choisissez l’instrumental."], "p": "Musique instrumentale de [20 secondes], genre [afro pop], ambiance joyeuse et motivante, tempo moyen-rapide, instruments : guitare claire, percussions légères, basse. Pensée pour un fond de vidéo de présentation : peu de variations, sans voix, avec une fin nette.", "q": {"q": "Quel choix pour un fond de vidéo ?", "o": ["Un instrumental sans voix", "Une chanson avec de fortes paroles", "Aucune musique jamais"], "a": 0, "e": "Sans voix, la musique ne gêne pas le message."}}, {"t": "Paroles et jingles", "d": "Un slogan musical pour votre marque", "b": ["Un <b>jingle</b> est une courte musique (10 à 20 secondes) qui accompagne votre nom ou votre slogan. Gardez les paroles <b>très courtes</b> et faciles à retenir, avec quelques rimes simples.", "L’IA peut proposer des paroles. Relisez-les à voix haute : la prononciation et le rythme doivent être naturels. Corrigez ce qui sonne faux."], "p": "Écris 5 versions de paroles de jingle de 4 lignes maximum pour [nom de la marque], qui propose [activité]. Intègre le slogan : [slogan]. Style : [joyeux, facile à retenir], avec des rimes simples en français. Indique pour chaque version le tempo et l’ambiance conseillés.", "q": {"q": "Comment doivent être les paroles d’un jingle ?", "o": ["Courtes et faciles à retenir", "Très longues", "Impossibles à prononcer"], "a": 0, "e": "Un jingle doit rester en tête."}}, {"t": "Utiliser la musique dans vos projets", "d": "Mixer, régler le volume et rester clair", "b": ["Dans un montage vidéo, placez la musique <b>sous la voix</b> avec un volume bas, et montez-la quand personne ne parle. Ajoutez un <b>fondu</b> au début et à la fin pour éviter les coupures brutales.", "Adaptez la <b>durée</b> de la musique à celle de la vidéo, et gardez un style cohérent pour toutes vos vidéos. Écoutez toujours le résultat sur un téléphone, avec un casque et sans."], "q": {"q": "Où placer la musique par rapport à la voix ?", "o": ["En dessous, avec un volume plus bas", "Plus fort que la voix", "Elle ne doit jamais accompagner la voix"], "a": 0, "e": "La voix doit rester parfaitement compréhensible."}}, {"t": "Droits, licence et éthique", "d": "Utiliser la musique IA sans risque", "b": ["Avant de publier ou de vendre :"], "l": ["Lisez la <b>licence</b> de l’outil : permet-elle un <b>usage commercial</b> ?", "Ne demandez jamais d’imiter la <b>voix d’un artiste réel</b> ni de copier une chanson existante.", "Les plateformes ont des <b>règles propres</b> sur les musiques créées par l’IA : vérifiez-les avant de publier.", "Gardez une <b>preuve de création</b> (prompts, dates, fichiers).", "Soyez transparent si vous diffusez une musique générée par l’IA."], "b2": ["<b>Mini-projet</b> : créez un jingle de 15 secondes pour votre marque, puis une musique de fond de 30 secondes pour une vidéo."], "q": {"q": "Peut-on demander la voix exacte d’un chanteur célèbre ?", "o": ["Non", "Oui sans limite", "Oui, à condition de le cacher"], "a": 0, "e": "Imiter la voix d’un artiste réel pose de gros problèmes de droits."}}];
LS["15"]=[{"t": "Comprendre un site web", "d": "Domaine, hébergement et créateur de site", "b": ["Un site web est un ensemble de pages accessibles par une adresse. Trois éléments le font fonctionner :"], "l": ["Le <b>nom de domaine</b> : votre adresse (par exemple monentreprise.com).", "L’<b>hébergement</b> : l’endroit où les fichiers sont stockés.", "Le <b>créateur de site</b> : l’outil qui permet de construire les pages sans coder (comme Wix, WordPress ou d’autres)."], "b2": ["Sur les réseaux sociaux, vous êtes chez quelqu’un d’autre. Avec un site, vous possédez votre espace, vous gardez vos informations et vous inspirez plus de confiance."], "q": {"q": "À quoi sert un nom de domaine ?", "o": ["À donner l’adresse de votre site", "À stocker les photos", "À payer vos clients"], "a": 0, "e": "C’est l’adresse que les gens tapent pour vous trouver."}}, {"t": "Planifier votre site", "d": "Objectif et pages essentielles", "b": ["Avant de construire, définissez l’<b>objectif</b> : recevoir des messages, vendre, présenter votre travail. Pour une petite activité, <b>4 pages</b> suffisent :"], "l": ["<b>Accueil</b> : votre promesse et un bouton d’action.", "<b>Offre ou services</b> : ce que vous vendez et les prix.", "<b>À propos</b> : qui vous êtes et pourquoi vous faire confiance.", "<b>Contact</b> : WhatsApp, téléphone, adresse, formulaire."], "b2": ["Pensez <b>mobile d’abord</b> : la plupart de vos visiteurs viendront de leur téléphone."], "p": "Tu es un expert en création de sites web. Propose la structure d’un site de 4 pages pour [activité] à [lieu], destiné à [public]. Pour chaque page : l’objectif, les sections dans l’ordre, le bouton d’action principal et les informations à préparer.", "q": {"q": "Combien de pages pour démarrer ?", "o": ["Quelques pages essentielles suffisent", "Cinquante", "Zéro"], "a": 0, "e": "Un site simple et clair vaut mieux qu’un site énorme."}}, {"t": "Rédiger le contenu avec l’IA", "d": "Textes clairs, courts et honnêtes", "b": ["Sur un site, on lit vite. Écrivez des <b>titres clairs</b>, des <b>paragraphes courts</b> et mettez en avant les <b>bénéfices</b> pour le client. Ajoutez une <b>FAQ</b> avec les questions fréquentes (prix, délais, livraison).", "L’IA écrit le premier jet, mais <b>n’inventez jamais</b> de témoignages, de chiffres ou de certifications. Relisez et adaptez avec vos vraies informations."], "p": "Rédige le texte de la page d’accueil d’un site pour [activité] à [lieu], destiné à [public]. Donne : un titre de moins de 8 mots, un sous-titre, 3 bénéfices clairs, un paragraphe de présentation de 60 mots, un bouton d’action et une FAQ de 5 questions. N’invente aucun témoignage ni chiffre.", "q": {"q": "Que faut-il éviter sur un site ?", "o": ["Les faux témoignages et chiffres inventés", "Les titres clairs", "Les paragraphes courts"], "a": 0, "e": "La confiance repose sur des informations vraies."}}, {"t": "Construire le site", "d": "Modèle, couleurs, logo et boutons", "b": ["Avec un créateur de site, commencez par un <b>modèle</b> simple. Personnalisez :"], "l": ["Vos <b>couleurs</b> et votre <b>logo</b>.", "Vos <b>vraies photos</b>, légères pour que le site reste rapide.", "Un bouton <b>WhatsApp</b> et un bouton <b>Appeler</b> bien visibles.", "Un formulaire de contact simple, si utile.", "Un menu clair, avec peu d’entrées."], "b2": ["Testez le site <b>sur plusieurs téléphones</b> avant de le publier : tout doit se lire et fonctionner sans effort."], "q": {"q": "Où tester son site avant publication ?", "o": ["Sur plusieurs téléphones", "Nulle part", "Seulement sur un grand écran"], "a": 0, "e": "La plupart des visiteurs utiliseront un téléphone."}}, {"t": "Être trouvé : les bases du référencement", "d": "Titres, descriptions et mots-clés", "b": ["Pour apparaître dans les recherches, utilisez les mots que vos clients tapent. Pensez à :"], "l": ["Un <b>titre de page</b> clair avec votre activité et votre ville.", "Une <b>description</b> courte qui donne envie de cliquer.", "Des <b>titres de sections</b> qui contiennent vos mots-clés naturellement.", "Des <b>images légères</b> avec un texte de description.", "Une <b>fiche Google</b> de votre entreprise, si elle est disponible dans votre pays."], "b2": ["Partagez votre site sur vos réseaux et dans votre bio. Le référencement demande du temps : soyez patient."], "p": "Propose 5 titres de page (60 caractères maximum) et 5 descriptions (150 caractères maximum) pour mon site de [activité] à [lieu], en utilisant les mots-clés [mots-clés]. Ton : clair et rassurant, sans promesse exagérée.", "q": {"q": "Que doit contenir un titre de page ?", "o": ["Votre activité et votre ville", "Un texte caché", "Rien"], "a": 0, "e": "Il doit dire clairement ce que vous faites et où."}}, {"t": "Légal, sécurité et suivi", "d": "Protéger votre site et vos visiteurs", "b": ["Quelques obligations et bonnes pratiques :"], "l": ["Informez-vous sur les <b>mentions légales</b> et la <b>politique de confidentialité</b> exigées dans votre pays.", "Vérifiez que le site utilise le <b>HTTPS</b> (cadenas dans l’adresse).", "Mots de passe solides, <b>vérification en deux étapes</b> et sauvegardes régulières.", "Consultez les <b>statistiques</b> : visites, pages vues, clics sur WhatsApp.", "Mettez à jour vos prix et informations."], "b2": ["<b>Mini-projet</b> : publiez un site d’une page avec votre offre, un bouton WhatsApp et votre politique de confidentialité, puis partagez-le à 10 personnes."], "q": {"q": "Que vérifier dans l’adresse du site ?", "o": ["Le HTTPS (cadenas)", "La couleur", "La longueur"], "a": 0, "e": "Le HTTPS protège les échanges avec vos visiteurs."}}];
LS["16"]=[{"t": "Comprendre les types d’applications", "d": "Native, web et no-code", "b": ["Il existe plusieurs façons de créer une application :"], "l": ["<b>Application native</b> : écrite spécialement pour Android ou iPhone, installée depuis une boutique.", "<b>Application web (PWA)</b> : un site qui s’installe sur l’écran d’accueil et peut fonctionner hors ligne.", "<b>Outils sans code (no-code)</b> : on assemble des écrans par glisser-déposer."], "b2": ["Pour débuter, une application web ou no-code est la plus rapide et la moins chère. Elle peut ensuite être transformée en application pour les boutiques."], "q": {"q": "Quelle option est la plus rapide pour débuter ?", "o": ["Une application web ou no-code", "Une application native complexe", "Aucune"], "a": 0, "e": "C’est plus simple et moins coûteux pour un premier projet."}}, {"t": "Définir le problème et les fonctions minimales", "d": "Le MVP : commencer petit", "b": ["Une bonne application résout <b>un problème précis</b>. Écrivez : qui l’utilisera, quel problème elle résout, et les <b>3 fonctions maximum</b> de la première version. On appelle cela le <b>MVP</b>, la version minimale utile.", "Plus tard, vous ajouterez des fonctions selon les demandes de vrais utilisateurs."], "p": "Tu es un chef de projet. Mon idée d’application : [décrivez]. Public : [public]. Rédige un cahier des charges d’une page : le problème résolu, les 3 fonctions de la première version, les écrans nécessaires et ce qu’il ne faut pas faire dans cette version. Pose-moi 3 questions si besoin.", "q": {"q": "Combien de fonctions pour une première version ?", "o": ["Peu, les plus utiles", "Toutes celles imaginables", "Aucune"], "a": 0, "e": "Commencer petit permet de tester vite."}}, {"t": "Concevoir les écrans", "d": "Maquettes simples et claires", "b": ["Dessinez vos écrans sur papier ou avec une application de design avant de construire. Chaque écran doit avoir <b>un seul objectif</b>. Gardez une navigation simple : un menu en bas avec 3 à 5 entrées."], "l": ["Textes <b>lisibles</b> sur petit écran.", "Boutons <b>assez grands</b> pour le pouce.", "Couleurs <b>contrastées</b>.", "Un <b>retour</b> clair sur chaque écran."], "p": "Décris les écrans d’une application mobile pour [idée]. Pour chaque écran : le titre, les éléments affichés, les boutons et ce qui se passe quand on touche chaque bouton. Propose un menu de 4 entrées maximum et un style visuel simple.", "q": {"q": "Quel est l’objectif d’un écran ?", "o": ["Un objectif clair", "Dix objectifs", "Aucun"], "a": 0, "e": "Un écran simple est plus facile à utiliser."}}, {"t": "Construire avec l’IA et le no-code", "d": "Du prototype à l’application", "b": ["L’IA peut vous aider à écrire du code simple ou à configurer un outil sans code. Demandez toujours de petites étapes, testez chaque étape et gardez des copies de vos versions.", "Règle de sécurité : ne collez <b>jamais de mots de passe, de clés secrètes ou de données de clients</b> dans l’IA ou dans un code public. Une clé visible peut être utilisée par n’importe qui."], "p": "Je construis une application web simple pour [idée]. Écris-moi le code d’un seul écran : [décrivez l’écran]. Utilise du HTML, du CSS et du JavaScript dans un seul fichier, sans clé secrète. Explique chaque partie simplement et dis-moi comment la tester sur mon téléphone.", "q": {"q": "Que faut-il éviter dans un code public ?", "o": ["Les clés secrètes et mots de passe", "Les couleurs", "Les boutons"], "a": 0, "e": "Tout ce qui est public peut être lu par n’importe qui."}}, {"t": "Tester avec de vrais utilisateurs", "d": "Observer et corriger", "b": ["Faites tester votre application par <b>5 personnes</b> de votre public sur leur propre téléphone. Ne les aidez pas : observez où ils hésitent. Notez les bugs et les passages confus.", "Vérifiez aussi : le fonctionnement <b>hors ligne</b>, la vitesse de chargement, le comportement sur plusieurs téléphones et tailles d’écran."], "b2": ["Corrigez d’abord ce qui bloque l’utilisateur, puis ce qui l’agace, puis le reste."], "q": {"q": "Comment bien tester ?", "o": ["Observer des utilisateurs sans les aider", "Le tester seul uniquement", "Ne jamais tester"], "a": 0, "e": "On voit les vrais problèmes en observant."}}, {"t": "Publier et protéger", "d": "Lien, boutique d’applications et données", "b": ["Vous pouvez partager votre application par un <b>lien</b> dès qu’elle est en ligne. Pour la proposer dans la boutique Google Play, il faut en général :"], "l": ["Un <b>compte développeur</b> (frais d’inscription uniques, vérification d’identité).", "Un <b>fichier d’application</b> prêt à envoyer.", "Une <b>politique de confidentialité</b> publique.", "Une <b>fiche</b> avec description, icône et captures d’écran.", "Parfois un <b>test fermé</b> avec des testeurs avant la publication : vérifiez les règles actuelles."], "b2": ["Respectez aussi les <b>règles de paiement</b> de la boutique pour les contenus numériques. Collectez le <b>minimum de données</b> personnelles et protégez-les.", "<b>Mini-projet</b> : écrivez le cahier des charges d’une application en 3 fonctions, construisez un prototype d’un écran et faites-le tester par 5 personnes."], "q": {"q": "Que faut-il fournir pour une application publique ?", "o": ["Une politique de confidentialité", "Rien", "Un mot de passe de client"], "a": 0, "e": "C’est une exigence courante pour protéger les utilisateurs."}}];
LS["20"]=[{"t": "Comprendre la vente en ligne", "d": "Modèles, canaux et limites", "b": ["Vendre en ligne peut se faire de plusieurs façons :"], "l": ["<b>Vos propres produits</b> : vous contrôlez la qualité et les délais.", "<b>Revente de produits d’un fournisseur</b> : plus de choix, mais moins de contrôle sur la qualité et les délais.", "<b>Produits numériques et services</b> : pas de stock, mais il faut du contenu de valeur."], "b2": ["Canaux possibles : catalogue <b>WhatsApp Business</b>, réseaux sociaux, site de boutique. Commencez par un seul canal et faites-le bien."], "q": {"q": "Combien de canaux pour commencer ?", "o": ["Un seul, bien maîtrisé", "Tous en même temps", "Aucun"], "a": 0, "e": "On progresse mieux en commençant simple."}}, {"t": "Choisir ses produits et fournisseurs", "d": "Demande, marge et qualité", "b": ["Choisissez des produits dont vous voyez la <b>demande réelle</b> autour de vous. Calculez votre <b>marge</b> : prix de vente moins tous les coûts (achat, transport, emballage).", "Testez vos fournisseurs avec une <b>petite commande</b> pour juger la qualité et les délais avant de commander en grand. Évitez les produits interdits ou contrefaits."], "p": "Tu es un conseiller en commerce. Je veux vendre [type de produits] à [lieu] à [public]. Propose 10 produits adaptés, avec pour chacun : le problème résolu, un prix de vente possible, les coûts à prévoir et un risque. Précise que je dois vérifier les prix avec mes fournisseurs.", "q": {"q": "Comment juger un fournisseur ?", "o": ["Avec une petite commande de test", "En commandant tout le stock tout de suite", "Sans jamais vérifier"], "a": 0, "e": "Une petite commande limite les risques."}}, {"t": "Fiches produits et photos", "d": "Informations vraies et images claires", "b": ["Une bonne fiche contient : un <b>titre clair</b>, le <b>prix</b>, les <b>tailles ou couleurs</b>, les <b>bénéfices</b>, les <b>caractéristiques réelles</b> et les informations de livraison.", "Prenez de <b>vraies photos</b> : fond propre, lumière du jour, plusieurs angles. L’IA peut aider à écrire les textes ou à créer une ambiance, mais le client doit voir le vrai produit."], "p": "Rédige la fiche produit de [produit] : titre de moins de 10 mots, 3 bénéfices, caractéristiques réelles : [liste], prix : [prix], livraison : [détails]. Ton : clair et honnête. N’invente aucune caractéristique ni avis client.", "q": {"q": "Que doit montrer la photo ?", "o": ["Le vrai produit", "Un produit différent", "Aucune photo"], "a": 0, "e": "Le client doit recevoir ce qu’il voit."}}, {"t": "Paiement et livraison", "d": "Sécuriser vos ventes", "b": ["Précisez clairement les <b>moyens de paiement</b> (Mobile Money, paiement à la livraison), les <b>frais</b> et les <b>délais</b> de livraison. Confirmez chaque commande par écrit.", "Soyez prudent : <b>vérifiez que l’argent est bien arrivé</b> sur votre compte avant d’expédier, car il existe de faux reçus. Ne demandez jamais un mot de passe ou un code secret à un client."], "b2": ["Gardez des preuves : captures de commandes, messages, reçus, preuve de livraison."], "q": {"q": "Que vérifier avant d’expédier ?", "o": ["Que l’argent est bien arrivé", "Rien", "Le mot de passe du client"], "a": 0, "e": "De faux reçus de paiement existent."}}, {"t": "Confiance et service client", "d": "Avis, retours et réponses", "b": ["La confiance fait vendre. Publiez de <b>vrais avis</b> de clients (avec leur accord), annoncez une <b>politique de retour ou d’échange</b> claire et répondez vite et poliment.", "Face à une plainte : restez calme, excusez-vous si vous avez tort, proposez une solution précise et un délai."], "p": "Écris 3 réponses polies à un client mécontent qui n’a pas reçu sa commande dans les délais promis, pour [activité]. Ton : calme, empathique et professionnel. Propose une solution concrète et demande les informations nécessaires. N’invente aucune excuse.", "q": {"q": "Que faire face à un client mécontent ?", "o": ["Rester calme et proposer une solution", "L’ignorer", "Le critiquer en public"], "a": 0, "e": "Une réponse polie préserve votre réputation."}}, {"t": "Légal, chiffres et croissance", "d": "Vendre en règle et progresser", "b": ["Informez-vous sur les <b>règles de votre pays</b> pour vendre et déclarer votre activité (organismes officiels ou professionnel). Indiquez clairement vos informations de vendeur et des <b>conditions de vente</b> simples.", "Suivez chaque semaine vos <b>ventes</b>, vos <b>stocks</b> et votre <b>marge</b>. Réinvestissez progressivement les bénéfices, et testez la publicité avec un petit budget."], "b2": ["<b>Mini-projet</b> : choisissez 5 produits, rédigez leurs fiches, créez un catalogue WhatsApp Business et faites vos 5 premières ventes de test."], "p": "Crée un tableau simple de suivi pour ma boutique : date, produit, quantité vendue, prix de vente, coût, marge, stock restant. Ajoute les 5 indicateurs à regarder chaque semaine et 3 questions pour décider quoi réapprovisionner.", "q": {"q": "Que suivre chaque semaine ?", "o": ["Ventes, stocks et marge", "Rien", "Seulement les likes"], "a": 0, "e": "Ce sont les chiffres qui guident vos décisions."}}];
LS["9"]=[{"t": "Comment Facebook rémunère les créateurs", "d": "Le programme de monétisation de contenu et les autres options", "b": ["Facebook propose plusieurs façons de gagner de l’argent. Le principal outil publicitaire pour les créateurs est le <b>Programme de monétisation de contenu</b>, qui a regroupé les anciennes options (publicités dans les Reels, publicités dans les vidéos, bonus de performance)."], "l": ["Gains selon la <b>performance</b> de vos contenus originaux (vidéos, Reels, photos, textes), si votre page est éligible.", "<b>Étoiles</b> et <b>abonnements</b> payants de fans, selon les pays.", "<b>Ventes directes</b> (Marketplace, catalogue, WhatsApp) et <b>partenariats</b> avec des marques."], "b2": ["Ces options ne sont pas disponibles partout, et les programmes sont renommés régulièrement. Gardez en tête que beaucoup de pages gagnent surtout <b>en vendant leurs propres produits et services</b>.", "<i>Repères vérifiés le 22 octobre 2026. Les conditions changent : vérifiez toujours dans l’application officielle avant de décider.</i>"], "q": {"q": "Que fait le programme de monétisation de contenu ?", "o": ["Rémunère les contenus originaux selon leur performance, si vous êtes éligible", "Garantit un salaire", "Supprime les pages"], "a": 0, "e": "Il rémunère selon les contenus et l’éligibilité."}}, {"t": "Les conditions et l’éligibilité", "d": "Ce qui est demandé, et pourquoi les chiffres changent", "b": ["À la date de cette formation, les conditions publiées par les sites tiers sont <b>contradictoires</b> : certains parlent de seuils d’abonnés ou de minutes de visionnage, d’autres décrivent un programme sur <b>invitation</b>. Meta ajuste ces règles souvent : ne vous fiez pas aux chiffres d’une vidéo ou d’un article ancien."], "l": ["Il faut une <b>Page</b> ou un profil en mode professionnel (pas seulement un profil personnel).", "Avoir au moins <b>18 ans</b> pour recevoir des paiements.", "Publier des contenus <b>originaux</b> qui respectent les règles de Meta.", "Être dans un <b>pays et une langue</b> où le programme est disponible."], "b2": ["Pour connaître votre statut exact, ouvrez <b>Meta Business Suite</b>, section <b>Monétisation</b>, puis <b>Éligibilité</b> : c’est la source la plus fiable.", "<i>Repères vérifiés le 22 octobre 2026. Les conditions changent : vérifiez toujours dans l’application officielle avant de décider.</i>"], "q": {"q": "Où vérifier votre éligibilité exacte ?", "o": ["Dans Meta Business Suite, section Monétisation", "Dans un message d’un inconnu", "Sur une vidéo ancienne"], "a": 0, "e": "L’outil officiel affiche votre statut réel."}}, {"t": "Créer un contenu original et respecter les règles", "d": "Éviter les sanctions", "b": ["Meta veut des contenus <b>originaux</b> et de qualité. Les pages qui republient les vidéos d’autres personnes, copient des contenus ou fabriquent du faux risquent de perdre l’accès à la monétisation."], "l": ["Créez <b>votre propre contenu</b> : votre voix, vos exemples, vos images.", "Évitez les titres <b>mensongers</b> ou les contenus qui piègent les gens.", "N’utilisez pas de musique, de vidéos ou d’images sans autorisation.", "Indiquez les contenus <b>réalistes créés par l’IA</b> quand la plateforme le demande.", "Protégez votre compte avec la <b>vérification en deux étapes</b>."], "b2": ["Une pratique malhonnête peut coûter la page entière. La confiance de votre public est votre meilleur capital."], "p": "Aide-moi à créer 10 idées de publications Facebook originales pour ma page sur [sujet], destinée à [public]. Pour chaque idée : le format (Reel, texte, photo), l’accroche, la valeur apportée et une question pour inciter aux commentaires. Aucun contenu copié ou trompeur.", "q": {"q": "Que risque une page qui republie le contenu d’autres personnes ?", "o": ["De perdre l’accès à la monétisation", "Rien", "D’être récompensée"], "a": 0, "e": "Le contenu original est exigé."}}, {"t": "Construire votre audience et votre régularité", "d": "Page, Reels et communauté", "b": ["La monétisation vient après une audience <b>engagée</b>. Reprenez les méthodes de la formation Facebook : page professionnelle, sujet précis, publications régulières, Reels courts, réponses aux commentaires et calendrier de 30 jours."], "l": ["Concentrez-vous sur <b>un sujet</b> et un public précis.", "Publiez de façon <b>régulière</b> plutôt que par à-coups.", "Analysez vos <b>statistiques</b> et gardez ce qui marche.", "Créez une <b>communauté</b> (groupe, messages, WhatsApp) où les gens se sentent écoutés."], "b2": ["Ne cherchez pas de raccourci : acheter des abonnés ou échanger des « likes » ne crée pas de clients et peut nuire à votre page."], "q": {"q": "Qu’est-ce qui prépare le mieux la monétisation ?", "o": ["Une audience engagée avec du contenu régulier", "Des abonnés achetés", "Des changements de nom constants"], "a": 0, "e": "Une communauté réelle vaut plus que des chiffres achetés."}}, {"t": "Gagner de l’argent au-delà du programme", "d": "Ventes directes, services et partenariats", "b": ["Même sans paiements de Facebook, votre page peut vous rapporter des revenus :"], "l": ["<b>Vendre vos produits ou services</b> avec un catalogue et un bouton WhatsApp.", "<b>Marketplace</b> et groupes de vente locaux, dans le respect des règles.", "<b>Partenariats</b> avec des entreprises : présentez vos vrais chiffres.", "<b>Formations ou accompagnement</b> payants, à partir de votre expérience.", "<b>Affiliation</b> honnête, avec le lien clairement indiqué."], "b2": ["Soyez transparent, tenez vos promesses et gardez des preuves de vos ventes et de vos livraisons."], "p": "Aide-moi à transformer ma page Facebook de [sujet] en source de revenus. Propose 3 offres (produit, service, formation) avec un prix de départ à tester, une publication pour chaque offre et un message WhatsApp pour répondre aux clients. Reste réaliste et honnête.", "q": {"q": "Quel bouton est utile sur une page de vente ?", "o": ["Un bouton WhatsApp", "Aucun bouton", "Un bouton qui ne marche pas"], "a": 0, "e": "Il permet de vous contacter facilement."}}, {"t": "Éviter les arnaques et planifier", "d": "Un plan réaliste sur 90 jours", "b": ["Quelques arnaques fréquentes autour de Facebook :"], "l": ["Vendeurs de <b>pages « déjà monétisées »</b> ou de comptes vérifiés.", "Faux messages de « l’assistance Meta » qui demandent un mot de passe ou un code.", "Promesses de <b>revenus garantis</b>.", "Demandes de paiement pour « débloquer » la monétisation."], "b2": ["Les paiements officiels demandent des <b>informations d’identité et de paiement</b> via les outils de Meta, jamais par un message privé inconnu. Ne partagez jamais votre mot de passe.", "Un plan réaliste : <b>90 jours</b> de publication régulière, suivi chaque semaine, objectifs de clients et d’abonnés. <b>Mini-projet</b> : vérifiez votre éligibilité dans Meta Business Suite, puis écrivez votre plan de 90 jours."], "q": {"q": "Que faire si on vous demande de payer pour débloquer la monétisation ?", "o": ["Refuser, c’est une arnaque probable", "Payer vite", "Donner son mot de passe"], "a": 0, "e": "Les déblocages payants sont des arnaques."}}];

LS["11"]=[{"t": "Comment YouTube rémunère les créateurs", "d": "Le Programme Partenaire et ses options", "b": ["YouTube partage des revenus avec les créateurs qui rejoignent le <b>Programme Partenaire YouTube</b> (YPP). Selon votre chaîne et votre pays, il peut inclure :"], "l": ["Une part des <b>revenus publicitaires</b> (vidéos longues et Shorts).", "Des <b>abonnements payants</b> à votre chaîne et des soutiens des fans (Super Chat, etc.).", "Des fonctions de <b>boutique</b> pour vendre des produits.", "Une part des revenus des abonnés <b>YouTube Premium</b>."], "b2": ["Important : toutes ces options ne sont pas disponibles dans tous les pays. Beaucoup de créateurs gagnent aussi <b>en dehors de YouTube</b> : clients, services, formations, partenariats. Nous verrons les deux chemins.", "<i>Repères vérifiés le 22 octobre 2026. Les conditions changent : vérifiez toujours dans l’application officielle avant de décider.</i>"], "q": {"q": "Qu’est-ce que le Programme Partenaire YouTube ?", "o": ["Le programme qui permet de gagner de l’argent avec votre chaîne", "Un jeu concours", "Une application de montage"], "a": 0, "e": "C’est le programme officiel de partage des revenus."}}, {"t": "Les conditions du Programme Partenaire", "d": "Repères au 22 octobre 2026", "b": ["Les conditions dépendent du niveau visé. Voici les repères connus à la date de cette formation :"], "l": ["<b>Niveau 1 (soutien des fans, boutique)</b> : 500 abonnés, 3 vidéos publiques dans les 90 derniers jours, et 3 000 heures de visionnage en 12 mois <b>ou</b> 3 millions de vues Shorts en 90 jours.", "<b>Niveau 2 (revenus publicitaires), jusqu’au 31 janvier 2027</b> : 1 000 abonnés et 4 000 heures de visionnage en 12 mois <b>ou</b> 10 millions de vues Shorts en 90 jours.", "<b>Nouveaux candidats à partir du 1er février 2027</b> : 1 000 abonnés et 8 000 heures de visionnage en 365 jours <b>ou</b> 20 millions de vues Shorts en 90 jours."], "b2": ["Les heures de visionnage des vidéos longues et les vues Sho blicités et partenariats, et ne recommandez que des produits que vous avez utilisés ou vérifiés."], "p": "Aide-moi à créer une offre à partir de ma chaîne YouTube sur [sujet]. Propose 3 offres (service, produit, formation) avec un prix à tester, le public visé, la promesse et un texte de description de vidéo avec mon contact WhatsApp : [numéro]. Les offres doivent être honnêtes et réalistes.", "q": {"q": "Comment présenter une affiliation ?", "o": ["En l’indiquant clairement", "En la cachant", "En mentant sur le produit"], "a": 0, "e": "La transparence est obligatoire et construit la confiance."}}, {"t": "Éviter les arnaques et planifier", "d": "Un plan réaliste sur 12 mois", "b": ["Méfiez-vous des promesses qui tournent autour de la monétisation :"], "l": ["<b>Acheter des abonnés ou des vues</b> : interdit et dangereux pour la chaîne.", "<b>« Gagnez beaucoup sans rien faire »</b> : c’est un signal d’arnaque.", "Les <b>faux e-mails « de YouTube »</b> : vérifiez l’adresse d’expéditeur (youtube.com, google.com) et ne cliquez pas sur des liens suspects. Ne donnez jamais votre mot de passe.", "Les personnes qui vendent un <b>déblocage</b> de monétisation."], "b2": ["Prévoyez un plan réaliste : <b>12 mois de publication régulière</b>, un suivi chaque mois, et un objectif de clients ou d’abonnés plutôt qu’un revenu promis.", "<b>Mini-projet</b> : vérifiez votre statut dans YouTube Studio, notez les conditions manquantes, puis écrivez votre plan de 90 jours."], "q": {"q": "Que faire face à une promesse de gains faciles ?", "o": ["Se méfier", "Envoyer de l’argent", "Donner son mot de passe"], "a": 0, "e": "Les gains garantis sans effort sont un signal d’arnaque."}}];

prompts:function(){var lv=rank()===3?"pro":rank()===2?"avancé":"simple";return '<h2>🤖 Prompts IA</h2><p class="mu">Niveau débloqué : <b>'+lv+'</b> (simples : Starter · avancés : Pro · professionnels : Premium)</p><label for="ct">Catégorie</label><select id="ct">'+PC.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select><label for="tp">Ton sujet ou ton produit</label><input id="tp" placeholder="ex. vente de vêtements à Abidjan"><button class="btn" id="mk">Générer le prompt</button><div class="box" id="out" hidden style="margin-top:12px"><pre id="pr"></pre><button class="btn alt" id="cp">Copier</button></div>'+back()},
course:function(){var L=LS[curC],n=0;L.forEach(function(x,k){if(S.lessons[curC+"-"+k])n++});var p=Math.round(n/L.length*100);return '<h2>'+CO[curC]+'</h2><p class="mu">'+n+' / '+L.length+' leçons terminées</p><div class="bar"><i style="width:'+p+'%"></i></div>'+L.map(function(x,k){var d=S.lessons[curC+"-"+k];return '<div class="box row"><div><b>'+(d?'✓ ':'')+(k+1)+'. '+x.t+'</b><span class="mu">'+x.d+'</span></div><button class="btn" data-les="'+k+'">'+(d?'Revoir':'Lire')+'</button></div>'}).join('')+'<button class="btn alt np" data-go="forma">← Formations</button>'},
lesson:function(){var x=LS[curC][curL],h='<button class="btn alt np" data-open="'+curC+'" style="margin:0 0 12px">← '+CO[curC]+'</button><div class="mu">Leçon '+(curL+1)+' sur '+LS[curC].length+'</div><h2>'+x.t+'</h2>';x.b.forEach(function(t){h+='<p>'+t+'</p>'});if(x.l)h+='<ul>'+x.l.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ul>';(x.b2||[]).forEach(function(t){h+='<p>'+t+'</p>'});if(x.p)h+='<div class="pbox"><b>Prompt à copier</b><pre id="pt">'+esc(x.p)+'</pre><button class="btn alt" id="cpl">Copier le prompt</button></div>';h+='<div class="box"><b>Quiz : '+x.q.q+'</b>'+x.q.o.map(function(o,k){return '<button class="lq" data-k="'+k+'">'+o+'</button>'}).join('')+'<div class="fb" id="fb"></div></div><div id="nx"></div>';return h},
abo:function(){if(PLAY)return aboPlay();return '<h2>⭐ Abonnements</h2>'+[["starter","Accès aux formations de base, prompts IA simples","Sans attestation ni certificat"],["pro","Toutes les formations, prompts avancés, attestation","Sans certificat"],["premium","Accès illimité, tous les prompts professionnels, attestation, certificat, futures mises à jour",""]].map(function(x){var p=PL[x[0]];return '<div class="box"><b>'+p.i+' '+p.n+' – '+p.p+(S.plan===x[0]?' <span class="tag">Actif</span>':'')+'</b><span class="mu">'+x[1]+'. '+x[2]+'</span><a class="btn wa" target="_blank" rel="noopener" href="'+wa('Bonjour, je veux m’abonner au plan '+p.n+' ('+p.p+') sur IA Creator. Nom : '+S.name)+'">Payer et s’abonner via WhatsApp</a></div>'}).join('')+'<div class="box"><b>💳 Moyens de paiement</b>🟠 Orange Money : '+PAY+'<br>🟢 Wave : '+PAY+'<br>💬 WhatsApp (preuve de paiement) : '+TELP+'<br>🟡 MTN Money : contactez-nous sur WhatsApp<p class="mu">Après le paiement, envoyez la preuve sur WhatsApp : vous recevez un code d’activation.</p></div><div class="box"><b>🔑 J’ai un code d’activation</b><input id="cd" placeholder="Votre code"><button class="btn" id="ac">Activer</button><p class="mu" id="ok"></p></div>'+back()},
cert:function(){var all=nd()===CO.length,a=rank()>=2,c=rank()===3&&all,dt=new Date().toLocaleDateString("fr-FR");function box(t,sub){return '<div class="cert"><img src="'+LOGO+'" alt=""><div class="mu">IA Creator – YOUL Multi-Services Digital</div><h3>'+t+'</h3><div class="mu">décerné à</div><div class="nm">'+esc(S.name)+'</div><div>'+sub+'</div><div class="mu" style="margin-top:10px">Le '+dt+'</div></div>'}
return '<h2>🎓 Certificat</h2>'+(c?box("CERTIFICAT DE RÉUSSITE","pour avoir terminé les "+CO.length+" formations")+'<button class="btn np" id="pt">Imprimer / Enregistrer en PDF</button>':'<div class="box np"><b>Certificat</b>Réservé aux abonnés Premium ayant terminé toutes les formations ('+nd()+' / '+CO.length+').</div>')+(a?'<div style="height:14px"></div>'+box("ATTESTATION DE FORMATION","pour avoir suivi "+nd()+" formation(s)")+'<button class="btn alt np" id="pt2">Imprimer l’attestation</button>':'<div class="box np"><b>Attestation</b>Réservée aux abonnés Pro et Premium.</div>')+back()},
contact:function(){return '<h2>📞 Contact</h2><div class="box"><b>WhatsApp officiel</b>'+TELC+'</div><a class="btn wa" target="_blank" rel="noopener" href="'+wa('Bonjour IA Creator, j’ai une question.',WAC)+'">Ouvrir WhatsApp</a>'+back()},
profil:function(){return '<h2>👤 Mon Profil</h2><label for="nm">Nom</label><input id="nm" value="'+esc(S.name)+'"><label for="em">Email ou téléphone</label><input id="em" value="'+esc(S.email)+'"><button class="btn" id="sv">Enregistrer</button><p class="mu" id="ok"></p>'+back()},
param:function(){return '<h2>⚙️ Paramètres</h2><div class="box"><b>Apparence</b><button class="btn alt" data-th="auto">Automatique</button><button class="btn alt" data-th="light">Clair</button><button class="btn alt" data-th="dark">Sombre</button></div><button class="btn alt" id="out">Déconnexion</button>'+back()}
};
function go(v){if(!S.name&&v!=="login")v="login";qi=0;qs=0;nav.hidden=v==="login";app.innerHTML=V[v]();window.scrollTo(0,0);bind()}
function $(i){return document.getElementById(i)}
function bind(){
app.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
app.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){var i=b.dataset.d;if(S.done[i])delete S.done[i];else S.done[i]=1;save();go("forma")}});
app.querySelectorAll("[data-th]").forEach(function(b){b.onclick=function(){var t=b.dataset.th;S.dark=t==="auto"?null:t==="dark";save();theme()}});
app.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){curC=+b.dataset.open;go("course")}});
app.querySelectorAll("[data-les]").forEach(function(b){b.onclick=function(){curL=+b.dataset.les;go("lesson")}});
app.querySelectorAll(".lq").forEach(function(b){b.onclick=function(){var x=LS[curC][curL],k=+b.dataset.k,fb=$("fb");if(k===x.q.a){b.classList.add("ok");fb.style.color="var(--ok)";fb.textContent="Bonne réponse ! "+x.q.e;S.lessons[curC+"-"+curL]=1;var all=true;LS[curC].forEach(function(y,j){if(!S.lessons[curC+"-"+j])all=false});if(all)S.done[curC]=1;save();var last=curL===LS[curC].length-1;$("nx").innerHTML='<button class="btn" id="nxb">'+(last?'Terminer la formation':'Leçon suivante →')+'</button>';$("nxb").onclick=function(){if(last){go("course")}else{curL++;go("lesson")}}}else{b.classList.add("bad");fb.style.color="var(--bad)";fb.textContent="Pas tout à fait, réessayez."}}});
if($("cpl"))$("cpl").onclick=function(){var t=$("pt").textContent;try{navigator.clipboard.writeText(t);this.textContent="Copié ✓"}catch(e){}};
var q=app.querySelectorAll(".opt");q.forEach(function(b){b.onclick=function(){var ok=+b.dataset.k===Q[qi].a;b.classList.add(ok?"ok":"bad");if(ok)qs++;q.forEach(function(x){x.disabled=true});setTimeout(function(){qi++;app.innerHTML=V.quiz();bind()},700)}});
if($("rq"))$("rq").onclick=function(){qi=0;qs=0;app.innerHTML=V.quiz();bind()};
if($("lg"))$("lg").onclick=function(){var n=$("nm").value.trim();if(!n){$("nm").focus();return}S.name=n;S.email=$("em").value;save();go("home")};
if($("sv"))$("sv").onclick=function(){S.name=$("nm").value||S.name;S.email=$("em").value;save();$("ok").textContent="Profil enregistré ✓"};
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(d){return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")})}
if($("ac"))$("ac").onclick=function(){var c=$("cd").value.toUpperCase().replace(/[^A-Z0-9]/g,""),o=$("ok");if(c.length<8){o.textContent="Code invalide.";return}o.textContent="Vérification…";try{sha("iacreator:"+c).then(function(hx){var p=HASHES[hx];if(p){S.plan=p;S.since=Date.now();save();go("abo");$("ok").textContent="Abonnement "+PL[p].n+" activé ✓"}else o.textContent="Code invalide."}).catch(function(){o.textContent="Vérification impossible sur cet appareil."})}catch(e){o.textContent="Vérification impossible sur cet appareil."}};
if($("out")&&$("out").tagName==="BUTTON")$("out").onclick=function(){S={name:"",email:"",plan:"",done:{},best:null,dark:S.dark};save();go("login")};
if($("pt"))$("pt").onclick=function(){window.print()};if($("pt2"))$("pt2").onclick=function(){window.print()};
if($("mk"))$("mk").onclick=function(){var c=$("ct").value,t=$("tp").value||"mon activité",r=rank(),x="Crée du contenu « "+c+" » pour : "+t+". Donne-moi 3 idées claires.";
if(r>=2)x="Tu es un expert en "+c+" et en marketing digital.\nContexte : "+t+".\nTâche : propose 5 idées détaillées avec un exemple concret pour chacune.\nFormat : liste numérotée, phrases courtes.\nTon : simple et motivant.";
if(r>=3)x+="\nCible : définis d’abord le client idéal (âge, besoin, budget).\nStratégie : ajoute un plan sur 7 jours, un appel à l’action et 2 variantes A/B.\nRésultat : indique comment mesurer le succès et monétiser.\nSi des infos manquent, pose-moi d’abord 3 questions.";
$("pr").textContent=x;$("out").hidden=false;$("cp").onclick=function(){try{navigator.clipboard.writeText(x);this.textContent="Copié ✓"}catch(e){}}};
}
nav.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}});
if(PLAY){var nb=nav.querySelector('[data-go="abo"]');if(nb&&nb.lastChild)nb.lastChild.textContent="Accès"}
go("home");
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
</body>
</html>
